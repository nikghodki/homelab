# Pocket ID contents (plan P1.13). Applied by hosts/files/pocket-id/pocketid_sync.py from dgx-1.
# Client secrets are created once and kept in secrets/console.enc.yaml as oidc_<id>_secret.
groups:
  - {name: admins, friendlyName: Admins}
  - {name: family, friendlyName: Family}

users:
  - {username: nikghodki, email: nikghodki@gmail.com, firstName: Nikhil, isAdmin: true, groups: [admins]}

clients:
  - id: grafana
    name: Grafana
    callbackURLs: [https://grafana.nghodki.ai/login/generic_oauth]
    launchURL: https://grafana.nghodki.ai
    groups: [admins]
  - id: phoenix
    name: Phoenix
    callbackURLs: [https://phoenix.nghodki.ai/oauth2/pocketid/tokens]
    launchURL: https://phoenix.nghodki.ai
    groups: [admins]
  - id: temporal
    name: Temporal
    callbackURLs: [https://temporal.nghodki.ai/auth/sso/callback]
    launchURL: https://temporal.nghodki.ai
    pkce: false        # Temporal UI 2.58 doesn't send PKCE
    groups: [admins]
  - id: argocd
    name: Argo CD
    callbackURLs: [https://argocd.nghodki.ai/auth/callback]
    launchURL: https://argocd.nghodki.ai
    groups: [admins]      # Argo CD RBAC also maps admins -> role:admin; PKCE S256 (enablePKCEAuthentication)
  # The one sign-in proxy (decision 0011): edge-auth in k3s, called by the front door for every app without its own
  # login. One callback for all of them; each Caddy route also checks its group (allowed_groups). PKCE S256.
  - id: litellm
    name: LiteLLM admin UI
    callbackURLs: [https://litellm-admin.nghodki.ai/sso/callback]
    launchURL: https://litellm-admin.nghodki.ai
    groups: [admins]      # LiteLLM maps the groups claim admins -> proxy_admin (GENERIC_ROLE_MAPPINGS_*); PKCE S256
  # DGXMM's own OIDC sign-in (auth.oidc in its config.yaml), behind the front door's edge-auth: after the door the user
  # lands straight in DGXMM (auto_redirect). admins -> DGXMM admin; nobody else may sign in. PKCE S256.
  - id: dgxmm
    name: DGX Model Manager
    callbackURLs: [https://dgxmanager.nghodki.ai/dgxmm/api/auth/oidc/callback]
    launchURL: https://dgxmanager.nghodki.ai/dgxmm/
    groups: [admins]
  - id: edge-auth
    name: Sign-in (front door)
    callbackURLs: [https://auth.nghodki.ai/oauth2/callback]
    launchURL: https://ops.nghodki.ai
    groups: [admins]

# Deleted from Pocket ID (and their oidc_<id>_secret from SOPS) by the sync: the per-app oauth2-proxy clients that
# edge-auth replaced.
removedClients:
  - docs
  - ops
  - gatus
  - mlflow

# Pocket ID contents (plan P1.13). Applied by hosts/files/pocket-id/pocketid_sync.py from dgx-1.
# Client secrets are created once and kept in secrets/console.enc.yaml as oidc_<id>_secret.
groups:
  - {name: admins, friendlyName: Admins}
  - {name: family, friendlyName: Family}

users:
  - {username: nikghodki, email: nikghodki@gmail.com, firstName: Nikhil, isAdmin: true, groups: [admins]}

clients:
  - id: grafana
    name: Grafana
    callbackURLs: [https://grafana.nghodki.ai/login/generic_oauth]
    launchURL: https://grafana.nghodki.ai
    groups: [admins]
  - id: gatus
    name: Gatus
    callbackURLs: [https://status.nghodki.ai/authorization-code/callback]
    launchURL: https://status.nghodki.ai
    pkce: false        # Gatus 5.38 doesn't send PKCE
    groups: [admins]
  - id: phoenix
    name: Phoenix
    callbackURLs: [https://phoenix.nghodki.ai/oauth2/pocketid/tokens]
    launchURL: https://phoenix.nghodki.ai
    groups: [admins]
  - id: ops
    name: Homepage (ops)
    callbackURLs: [https://ops.nghodki.ai/oauth2/callback]
    launchURL: https://ops.nghodki.ai
    groups: [admins]      # oauth2-proxy also checks --allowed-group=admins; PKCE S256
  - id: temporal
    name: Temporal
    callbackURLs: [https://temporal.nghodki.ai/auth/sso/callback]
    launchURL: https://temporal.nghodki.ai
    pkce: false        # Temporal UI 2.58 doesn't send PKCE
    groups: [admins]
  - id: mlflow
    name: MLflow
    callbackURLs: [https://mlflow.nghodki.ai/oauth2/callback]
    launchURL: https://mlflow.nghodki.ai
    groups: [admins]      # oauth2-proxy also checks allowed_groups = admins; PKCE S256

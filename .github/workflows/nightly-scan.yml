name: nightly-scan

on:
  schedule:
    - cron: "17 9 * * *"  # 01:17 PST / 02:17 PDT
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  scan:
    name: Nightly scan + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --exit-code 1
      - name: OSV-Scanner (new advisories for existing dependencies)
        run: |
          set +e
          docker run --rm -v "$PWD:/src:ro" "$OSV_IMAGE" scan source -r /src
          rc=$?
          if [ "$rc" -eq 128 ]; then echo "no dependency manifests yet"; exit 0; fi
          exit "$rc"
      - name: Trivy scan of every pinned image
        run: |
          mkdir -p reports
          # every image@sha256 reference in workflows and cluster manifests
          grep -rhoE '[a-z0-9][a-z0-9./_-]*:[A-Za-z0-9._-]+@sha256:[a-f0-9]{64}' .github cluster 2>/dev/null | sort -u > reports/images.txt || true
          echo "## Image scan" >> "$GITHUB_STEP_SUMMARY"
          rc=0
          while read -r img; do
            [ -n "$img" ] || continue
            if docker run --rm "$TRIVY_IMAGE" image --severity CRITICAL --exit-code 1 --no-progress --quiet "$img" > "reports/$(echo "$img" | tr '/:@' '___').txt" 2>&1; then
              echo "- ok: \`$img\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **CRITICAL findings**: \`$img\`" >> "$GITHUB_STEP_SUMMARY"; rc=1
            fi
          done < reports/images.txt
          exit "$rc"
      - name: SBOM of the repo (CycloneDX)
        if: always()
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --format cyclonedx --no-progress /src > reports/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-reports
          path: reports/
          retention-days: 30

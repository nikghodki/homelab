name: pr-checks

# Two jobs, each a sequence of steps, because GitHub bills every job rounded up to a whole minute (8 parallel jobs of
# 12-146 s billed 12-14 min a run). Runs on PRs; once a day on main, the full suite (it catches merge skew and saves
# the tool venv, Trivy and Ansible caches where every PR can restore them: a cache saved on a PR ref is visible to that
# PR only); and manually. No push to main: a squash merge pushes the tree the PR run passed (infra-optimization review 2026-11 §4).
# A PR that changes only docs runs the docs build, secret scanning, SOPS, the edge-zone check (and yamllint if it
# touches YAML); everything else is skipped (.github/scripts/ci-scope.sh). Later steps run after a failed one
# (`!cancelled()`), so one run reports every failure; any failed step fails the job.
on:
  pull_request:
  schedule:
    - cron: "47 8 * * *"  # 00:47 PST, before nightly-scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a PR cancels its older run; the daily and manual runs each get their own group and always finish.
  group: pr-checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.99.9@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca
  SEMGREP_IMAGE: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  KYVERNO_IMAGE: ghcr.io/kyverno/kyverno-cli:v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  checks:
    name: Checks (lint, docs, secrets, Kubernetes, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the secret scanners read the PR's commits (or main's history)
          persist-credentials: false
      - name: What this run covers (PR commits, docs-only or code)
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-scope.sh

      # --- secrets: the PR's own commits (base..head), not every branch; the daily run and nightly-scan read history
      - name: gitleaks (PR commits; full history outside a PR)
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          range=HEAD; [ -z "$BASE" ] || range="$BASE..$HEAD_SHA"
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --verbose --exit-code 1 --log-opts="$range"
      - name: TruffleHog (verified secrets; PR commits, full history outside a PR)
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        # TruffleHog exits 0 on an unknown ref, so ci-scope.sh has already checked that both commits exist
        run: |
          if [ -n "$BASE" ]; then range=(--since-commit "$BASE" --branch "$HEAD_SHA"); else range=(); fi
          docker run --rm -v "$PWD:/repo:ro" "$TRUFFLEHOG_IMAGE" git file:///repo "${range[@]}" --only-verified --fail --no-update
      - name: secrets/ is SOPS-encrypted
        if: ${{ !cancelled() }}
        run: .github/scripts/check-sops.sh
      - name: Every scanner image is pinned by digest
        # tags can be moved (the March 2026 Trivy release and trivy-action tags were): docker run only by digest
        if: ${{ !cancelled() }}
        run: |
          if grep -nE '^\s+[A-Z_]+_IMAGE:' .github/workflows/*.yml | grep -vE '@sha256:[a-f0-9]{64}$'; then
            echo "::error::image not pinned by digest (above)"; exit 1
          fi
      - name: edge zone and CA page match cluster/platform/edge/names.txt and hosts/files/web-ca
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/edge-zone.py check

      # --- docs site (docs-site/, runbooks/docs-site.md) as the Dell builds it, without publishing anything
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: Tool venvs cache (built from the hash-locked files; key = Python version + lock hashes)
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/venvs/ci
            ~/venvs/docs
          key: venvs-checks-${{ steps.py.outputs.python-version }}-${{ hashFiles('.github/requirements-ci.txt', 'docs-site/requirements-docs.txt') }}
      - name: Install MkDocs (pinned with hashes)
        id: mkdocs
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/ci-venv.sh "$HOME/venvs/docs" docs-site/requirements-docs.txt --only-binary=:all:
      - name: Docs site (mkdocs build --strict; fails on any warning, broken link or anchor)
        if: ${{ !cancelled() && steps.mkdocs.outcome == 'success' }}
        run: ~/venvs/docs/bin/mkdocs build --strict -f docs-site/mkdocs.yml -d /tmp/docs-site

      # --- lint (yamllint also on a docs-only PR that touches YAML)
      - name: Install Python tools
        id: pyci
        if: ${{ !cancelled() && (steps.scope.outputs.code == 'true' || steps.scope.outputs.yaml == 'true') }}
        run: |
          .github/scripts/ci-venv.sh "$HOME/venvs/ci" .github/requirements-ci.txt
          echo "$HOME/venvs/ci/bin" >> "$GITHUB_PATH"
      - name: yamllint
        if: ${{ !cancelled() && steps.pyci.outcome == 'success' }}
        run: yamllint -c .yamllint.yaml .
      - name: actionlint
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: shellcheck (*.sh and shell templates)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: .github/scripts/shellcheck.sh "$SHELLCHECK_IMAGE"
      - name: Ansible collections cache (per day and hosts/requirements.yml, so new collection releases still arrive)
        # PRs may fall back to an earlier day's copy; the daily run on main never does, so it installs the current
        # releases and saves them for the day (ansible-galaxy keeps whatever satisfies requirements.yml)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('hosts/requirements.yml', '.github/requirements-ci.txt') }}-${{ steps.scope.outputs.day }}
          restore-keys: >-
            ${{ github.event_name == 'pull_request'
            && format('ansible-collections-{0}-', hashFiles('hosts/requirements.yml', '.github/requirements-ci.txt')) || '' }}
      - name: ansible-lint
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' && hashFiles('hosts/**/*.yml', 'hosts/**/*.yaml') != '' }}
        working-directory: hosts
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-lint playbooks/site.yml roles

      # --- Kubernetes manifests
      - name: kubeconform + Kyverno CLI
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: .github/scripts/check-kubernetes.sh "$KUBECONFORM_IMAGE" "$KYVERNO_IMAGE"

      - name: Open WebUI overlay builds on its pinned base (only when cluster/apps/open-webui/image changes)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: .github/scripts/open-webui-overlay-check.sh "$BASE"

      # --- unit tests
      - name: "Unit tests: fleet-metrics"
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: hosts/files/fleet-metrics
        run: python -m pytest -q
      - name: DefenseClaw LiteLLM guardrail
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: cluster/apps/litellm/proxy
        run: PYTHONPATH=. python -m pytest -q tests/test_defenseclaw_guardrail.py
      - name: LiteLLM request hook (system merge, file attachments as text, DefenseClaw judge reply repair)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: cluster/apps/litellm/proxy
        run: PYTHONPATH=. python -m pytest -q tests/test_documents_to_text.py tests/test_judge_reply_repair.py
      - name: "Unit tests: Mac dev-setup (installer logic on fixtures; bash, jq, awk)"
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: bash tools/dev-setup/tests/run.sh
      - name: DefenseClaw fleet policy
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: policies/defenseclaw
        run: python -m pytest -q tests
      - name: Pocket ID sync
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: hosts/files/pocket-id
        run: python -m pytest -q tests
      - name: Robot safety governor (pure logic and sinks; no ROS or NATS)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: robots/safety/governor
        run: PYTHONPATH=. python -m pytest -q tests
      - name: Robot motion bridge (pure logic; no ROS)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: robots/safety/motion_bridge
        run: PYTHONPATH=. python -m pytest -q tests
      - name: Cisco AIBOM fleet job
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q hosts/roles/cisco_aibom/files/tests
      - name: MCP drift check
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q hosts/roles/mcp_drift/files/tests
      - name: DefenseClaw AIBOM nightly diff
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q hosts/roles/defenseclaw_aibom/files/tests
      - name: Sim job sampler and watchdog (measure.sh, stub docker/nvidia-smi)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q robots/sim/tests
      - name: LiteLLM usage exporter
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q hosts/roles/litellm_usage_exporter/files/tests
      - name: Ops agent host access (ops-ro dispatcher and root helper)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q hosts/roles/ops_agent_access/files/tests
      - name: Open WebUI overlay patch (Ask Me branding)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: cluster/apps/open-webui/image
        run: python -m pytest -q tests
      - name: Open WebUI TPS meter and settings Job (counting, status throttling, settings.yaml contract)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: cluster/apps/open-webui
        run: python -m pytest -q functions/tests config/tests
      - name: CI scripts (DefenseClaw bundle, MCP tool hashes)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python -m pytest -q .github/scripts/tests
      - name: DefenseClaw dashboards and rules match the pinned release
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python .github/scripts/defenseclaw-bundle.py check
      # Last: the agent's own pinned dependencies (with hashes) go into a directory ahead of the tools venv on
      # PYTHONPATH, not into the venv itself (it is cached and shared by every run)
      - name: Ops agent (correlation, redaction, tools, notifications)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        working-directory: agents/ops-agent
        run: |
          pip install -q --require-hashes --no-deps --target "$RUNNER_TEMP/ops-agent-deps" -r requirements.txt
          PYTHONPATH=".:$RUNNER_TEMP/ops-agent-deps" python -m pytest -q tests

  scans:
    name: Scans (code, dependencies, AI scanners, AIBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # the merge commit and its parents: what the PR changes
          persist-credentials: false
      - name: What this run covers (docs-only PRs skip the scans)
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-scope.sh

      # --- code, dependency and config scanning
      - name: Semgrep
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --error
      - name: OSV-Scanner (dependencies)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          set +e
          docker run --rm -v "$PWD:/src:ro" "$OSV_IMAGE" scan source -r /src
          rc=$?
          # 128 = no package manifests found yet
          if [ "$rc" -eq 128 ]; then echo "no dependency manifests yet"; exit 0; fi
          exit "$rc"
      - name: Trivy ignore file (reasons, 30-day expiry)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: python3 .github/scripts/check-trivy-ignores.py --no-expiry
      - name: Trivy DB and checks cache (one per day; a stale DB is refreshed by Trivy itself)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.scope.outputs.day }}
          restore-keys: trivy-db-
      - name: Trivy (vulnerabilities, misconfigurations)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        # No `secret` scanner: gitleaks and TruffleHog (verified) in the checks job cover it
        run: >
          mkdir -p "$RUNNER_TEMP/trivy-cache" &&
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/cache" -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --cache-dir /cache
          --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress
          --ignorefile /src/.trivyignore.yaml /src

      # --- AI scanners (MCP tools, skills, agent cards, agent code)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        with:
          python-version: "3.12"
      - name: Tool venvs cache (built from the hash-locked files; key = Python version + lock hashes)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/venvs/ci
            ~/venvs/aibom
            ~/venvs/radar
          key: >-
            venvs-scans-${{ steps.py.outputs.python-version }}-${{ hashFiles('.github/requirements-ci.txt',
            '.github/requirements-aibom.txt', '.github/requirements-radar.txt') }}
      - name: Install scanners
        id: pyci
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          .github/scripts/ci-venv.sh "$HOME/venvs/ci" .github/requirements-ci.txt
          echo "$HOME/venvs/ci/bin" >> "$GITHUB_PATH"
      - name: MCP tool definitions match their reviewed hashes
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python3 .github/scripts/mcp-tool-hashes.py check tools
      - name: mcp-scanner (static, YARA)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python3 .github/scripts/scan-mcp-tools.py tools
      - name: skill-scanner
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: .github/scripts/scan-skills.sh
      - name: a2a-scanner still flags a known-bad agent card
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python3 .github/scripts/scan-agents.py --self-test
      - name: a2a-scanner (agent cards, offline analyzers)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: python3 .github/scripts/scan-agents.py
      - name: Agentic Radar (own venv; it pins rich<14)
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' && steps.pyci.outcome == 'success' }}
        run: |
          .github/scripts/ci-venv.sh "$HOME/venvs/radar" .github/requirements-radar.txt
          PATH=$HOME/venvs/radar/bin:$PATH .github/scripts/scan-agent-code.sh
      - name: Agentic Radar reports
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-radar
          path: reports/agentic-radar
          if-no-files-found: ignore

      # --- AI BOM (Cisco AIBOM)
      - name: Install cisco-aibom (own venv)
        id: aibom-install
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: .github/scripts/ci-venv.sh "$HOME/venvs/aibom" .github/requirements-aibom.txt
      - name: AI BOM of the repo
        # `analyze` requires an LLM; CI has none, so it points at a closed port and the BOM is deterministic-only
        # (agentic_status "degraded" in the report). The fleet job (runbooks/aibom.md) works the same way.
        # aibom-ci.py is cisco-aibom without the fixed 60 s of retry cool-down that cannot help with no LLM.
        if: ${{ !cancelled() && steps.aibom-install.outcome == 'success' }}
        run: |
          mkdir -p reports
          ~/venvs/aibom/bin/python .github/scripts/aibom-ci.py --log-level WARNING analyze . -o json -O reports/aibom.json \
            --llm-model none --llm-provider openai --llm-api-base http://127.0.0.1:9 --llm-api-key unused \
            --agentic-max-retry-seconds 0 --agentic-timeout 5 --no-progress --no-show-summary
          python3 -c 'import json; s = json.load(open("reports/aibom.json"))["aibom_analysis"]["summary"]; print(json.dumps(s))' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        with:
          name: aibom
          path: reports/aibom.json
          if-no-files-found: ignore
          retention-days: 30

name: build-sign

# Builds the fleet images from this repo, pushes them to ghcr.io/nikghodki/<name>, signs them with cosign keyless
# (GitHub OIDC; no keys) and attaches a signed SPDX SBOM. Kyverno admits ghcr.io/nikghodki/* only with this
# workflow's signature from main (policies/kyverno/verify-images.yaml). Runbook: runbooks/build-sign.md.
# Not built here: robots/sim/mujoco (~12 GB with the CUDA wheels; decision 0008).
# Only GitHub-owned actions are allowed in this repo, so buildx, QEMU and cosign are plain tools: binaries pinned by
# SHA-256, images by digest (like pr-checks.yml).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sign.yml
      - .github/scripts/image-spec.sh
      - hosts/stacks/ml/mlflow/**
      - hosts/stacks/ml/compose.yaml
      - hosts/roles/ros_zenoh_router/templates/Dockerfile.j2
      - hosts/roles/ros_zenoh_router/defaults/main.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-sign-${{ github.ref }}
  cancel-in-progress: false

env:
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
  BUILDX_URL: https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.linux-amd64
  BUILDX_SHA256: 5fb31a097304fbf6dd4038649a0decf32c2b9510e4047acd7d68b9d700c46194
  COSIGN_URL: https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  PLATFORMS: linux/amd64,linux/arm64
  # What Kyverno and `cosign verify` check (runbooks/build-sign.md).
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-sign.yml@refs/heads/main
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: Build, sign, attest (${{ matrix.image }})
    # Only main: the signing identity is the workflow at refs/heads/main, and nothing else may push images.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to ghcr.io/nikghodki
      id-token: write   # cosign keyless (Fulcio certificate from the GitHub OIDC token)
    strategy:
      fail-fast: false
      matrix:
        image: [mlflow, ros-zenoh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build spec
        id: spec
        run: .github/scripts/image-spec.sh "${{ matrix.image }}" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Tools (buildx, cosign; pinned by SHA-256), QEMU for arm64, BuildKit builder
        run: |
          mkdir -p "$HOME/.docker/cli-plugins" "$HOME/bin"
          curl -sSfL -o "$HOME/.docker/cli-plugins/docker-buildx" "$BUILDX_URL"
          echo "$BUILDX_SHA256  $HOME/.docker/cli-plugins/docker-buildx" | sha256sum -c -
          curl -sSfL -o "$HOME/bin/cosign" "$COSIGN_URL"
          echo "$COSIGN_SHA256  $HOME/bin/cosign" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx" "$HOME/bin/cosign"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          docker buildx version
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64
          docker buildx create --name homelab --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap | grep -E '^(Name|Driver|Platforms)'
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        id: build
        env:
          CONTEXT: ${{ steps.spec.outputs.context }}
          FILE: ${{ steps.spec.outputs.file }}
          IMAGE: ${{ steps.spec.outputs.image }}
          TAGS: ${{ steps.spec.outputs.tags }}
        run: |
          tag_args=(); IFS=, read -ra tags <<< "$TAGS"; for t in "${tags[@]}"; do tag_args+=(--tag "$t"); done
          # BuildKit SPDX SBOM and provenance per platform go inside the image index (so the signature covers them).
          # Layer cache in the registry (`:buildcache`, written only from here): unchanged layers aren't rebuilt.
          docker buildx build "$CONTEXT" --file "$FILE" --platform "$PLATFORMS" --push "${tag_args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --sbom=true --provenance=mode=max \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --metadata-file metadata.json
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless) and attest the SBOM
        env:
          REF: ${{ steps.spec.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # Fulcio/Rekor answer 5xx now and then; cosign itself retries only twice.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed; retrying in $((i * 20)) s"; sleep $((i * 20)); done; return 1; }
          retry cosign sign --yes "$REF"
          # The full BuildKit SBOM (with every file) stays in the signed index. The cosign attestation is the arm64
          # SBOM at package level: Rekor refuses entries over ~32 MB, and the ROS image's full SPDX is ~28 MB
          # (~38 MB as a DSSE envelope); without the file list it is ~3 MB.
          docker buildx imagetools inspect "$REF" --format '{{ json (index .SBOM "linux/arm64").SPDX }}' > sbom-full.spdx.json
          test -s sbom-full.spdx.json && [ "$(head -c 4 sbom-full.spdx.json)" != "null" ]
          jq -c 'del(.files) | .packages |= map(del(.hasFiles))
            | .relationships |= map(select((.spdxElementId | startswith("SPDXRef-File-") | not)
                and (.relatedSpdxElement | startswith("SPDXRef-File-") | not)))' sbom-full.spdx.json > sbom.spdx.json
          echo "SBOM: $(jq '.packages | length' sbom.spdx.json) packages, $(wc -c < sbom.spdx.json) bytes (full: $(wc -c < sbom-full.spdx.json))"
          retry cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Verify
        env:
          REF: ${{ steps.spec.outputs.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.spec.outputs.tags }}
          IMAGE: ${{ matrix.image }}
        run: |
          cosign verify "$REF" --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          {
            echo "### $IMAGE"
            echo "- \`$REF\` ($PLATFORMS)"
            echo "- tags: \`$TAGS\`"
            echo "- signed and SBOM-attested by \`$CERT_IDENTITY\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io

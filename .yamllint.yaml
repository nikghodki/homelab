extends: default
rules:
  document-start: disable
  line-length:
    max: 160
    level: warning
    ignore: |
      *.enc.yaml
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

# policies/kyverno (Deny since P3.5, runbooks/kyverno.md). Retries until the Kyverno CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: git@github.com:nikghodki/homelab.git
    targetRevision: main
    path: policies/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}

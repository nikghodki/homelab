# App of apps: every Application (and AppProject) in this folder. Manages itself; applied once by the bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nikghodki/homelab.git
    targetRevision: p3.4-platform
    path: cluster/bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}

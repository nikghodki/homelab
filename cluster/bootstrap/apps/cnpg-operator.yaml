# CloudNativePG operator only (cluster/platform/cnpg-operator). No resources finalizer: deleting the Application
# must not delete the CRDs (that would delete every Postgres cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valueFiles: [$values/cluster/platform/cnpg-operator/values.yaml]
    - repoURL: git@github.com:nikghodki/homelab.git
      targetRevision: p3.4-platform
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}

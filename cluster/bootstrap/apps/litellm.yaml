# LiteLLM, the model gateway (cluster/apps/litellm, runbooks/litellm.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: apps
  source:
    repoURL: git@github.com:nikghodki/homelab.git
    targetRevision: main
    path: cluster/apps/litellm
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}

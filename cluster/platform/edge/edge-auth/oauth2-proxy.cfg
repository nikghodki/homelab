# edge-auth: the one oauth2-proxy for every browser app without its own login (decision 0011, runbooks/sign-in.md).
# The in-cluster Caddy calls /oauth2/auth?allowed_groups=<group> for each request (forward auth) and sends signed-out
# browsers to /oauth2/start; the callback is https://auth.nghodki.ai/oauth2/callback for every app. No secrets here:
# OAUTH2_PROXY_CLIENT_SECRET and OAUTH2_PROXY_COOKIE_SECRET come from the Secret edge-auth (KSOPS).
http_address = "0.0.0.0:4180"
# Forward auth only: nothing is proxied to an app from here (Caddy proxies to the app after a 2xx).
upstreams = ["static://202"]
reverse_proxy = true
# Only the Caddy pods may set X-Forwarded-* (the NetworkPolicy edge-auth lets nothing else in on :4180).
trusted_proxy_ips = ["10.42.0.0/16"]
real_client_ip_header = "X-Forwarded-For"

provider = "oidc"
provider_display_name = "Pocket ID"
oidc_issuer_url = "https://id.nghodki.ai"
# Endpoints given, not discovered, so the proxy starts (and signed-in sessions keep working) while Pocket ID is down.
skip_oidc_discovery = true
login_url = "https://id.nghodki.ai/authorize"
redeem_url = "https://id.nghodki.ai/api/oidc/token"
oidc_jwks_url = "https://id.nghodki.ai/.well-known/jwks.json"
profile_url = "https://id.nghodki.ai/api/oidc/userinfo"
# id.nghodki.ai has the homelab web CA's wildcard; this pod trusts only that CA for it.
provider_ca_files = ["/etc/oauth2-proxy/ca/nghodki-web-ca.crt"]
client_id = "edge-auth"
redirect_url = "https://auth.nghodki.ai/oauth2/callback"
code_challenge_method = "S256"
scope = "openid email profile groups"
oidc_groups_claim = "groups"
email_domains = ["*"]
# No global allowed_groups: each Caddy route asks for its group (allowed_groups query parameter), and the Pocket ID
# client only lets admins in at all.
skip_provider_button = true
# After sign-in, back to the app the browser came from (any *.nghodki.ai name).
whitelist_domains = [".nghodki.ai"]

# One session for every *.nghodki.ai app: 7 days, tokens refreshed hourly (the refreshed cookie reaches the browser
# through Caddy's copy_response_headers).
cookie_name = "_edge_auth"
cookie_domains = [".nghodki.ai"]
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"
# Several tabs signing in at once each get their own CSRF cookie.
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
cookie_csrf_expire = "15m"

silence_ping_logging = true

# Caddy, the *.nghodki.ai front door (decision 0007, runbooks/edge.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-caddy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-caddy
  labels: {app.kubernetes.io/name: edge-caddy, app.kubernetes.io/part-of: edge}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: edge-caddy}
  strategy:
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: edge-caddy, app.kubernetes.io/part-of: edge}
    spec:
      serviceAccountName: edge-caddy
      automountServiceAccountToken: false
      nodeSelector: {nghodki.ai/role: gpu}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: edge-caddy}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
        # :80 and :443 inside the pod's own network namespace, without root or NET_BIND_SERVICE (a "safe" sysctl).
        sysctls:
          - {name: net.ipv4.ip_unprivileged_port_start, value: "0"}
      terminationGracePeriodSeconds: 20
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - {name: XDG_DATA_HOME, value: /data}
            - {name: XDG_CONFIG_HOME, value: /config}
            - {name: GOMEMLIMIT, value: 150MiB}
          ports:
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            - {name: probe, containerPort: 8081}
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: probe}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: probe}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true}
            - {name: ca, mountPath: /etc/caddy/ca, readOnly: true}
            - {name: tls, mountPath: /etc/caddy/certs, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: xdg-config, mountPath: /config}
      volumes:
        - name: config
          configMap: {name: edge-caddy}
        - name: ca
          configMap: {name: edge-ca-page}
        - name: tls
          secret: {secretName: web-tls, defaultMode: 288}  # 0440: owner + fsGroup 65532
        - name: data
          emptyDir: {sizeLimit: 16Mi}
        - name: xdg-config
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-caddy
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: edge-caddy}
---
# LAN: the edge VIP, shared with edge-dns-lan (different ports). No NodePorts.
apiVersion: v1
kind: Service
metadata:
  name: edge-caddy-lan
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.86.11
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: edge-caddy}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
    - {name: https, port: 443, targetPort: https, protocol: TCP}
---
# Tailnet: the Sparks' Tailscale IPs. Only dgx-2's until the cutover (dgx-1's :80/:443 are edge-caddy's).
apiVersion: v1
kind: Service
metadata:
  name: edge-caddy-tailnet
spec:
  type: ClusterIP
  externalIPs: [100.124.175.23]
  selector: {app.kubernetes.io/name: edge-caddy}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
    - {name: https, port: 443, targetPort: https, protocol: TCP}

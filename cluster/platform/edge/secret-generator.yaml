# KSOPS: the *.nghodki.ai wildcard cert (hosts/files/pki/web.crt) and its key (pki_web_key in secrets/pki.enc.yaml).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: edge-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./web-tls.enc.yaml

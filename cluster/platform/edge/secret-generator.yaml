# KSOPS: the *.nghodki.ai wildcard cert (hosts/files/pki/web.crt) and its key (pki_web_key in secrets/pki.enc.yaml);
# edge-auth: the sign-in proxy's Pocket ID client secret, its cookie secret and the edge origin token (decision 0011).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: edge-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./web-tls.enc.yaml
  - ./edge-auth.enc.yaml

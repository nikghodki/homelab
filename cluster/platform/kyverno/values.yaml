# Kyverno: chart kyverno 3.10.0 (Kyverno v1.20.0), namespace kyverno. Used by cluster/bootstrap/apps/kyverno.yaml.
# Policies live in policies/kyverno (Enforce, runbooks/kyverno.md). Admission controller: 2 replicas, one per Spark;
# reports controller: 1. Small limits (decisions 0006, 0008).
crds:
  install: true
  # Storage-version migration Job (post-upgrade hook = Argo CD PostSync, runs when this app syncs).
  migration:
    nodeSelector:
      nghodki.ai/role: gpu

# Webhooks never see kube-system, kyverno or argocd (Kyverno adds its own namespace too): a dead Kyverno can't block
# the cluster's own add-ons, Kyverno itself or Argo CD, even though the policies fail closed (failurePolicy Fail)
# everywhere else. Background scans still report on them. `edge` (the front door: CoreDNS, Caddy) is out too, for the
# same reason: it must be able to restart while Kyverno is down (decision 0007). Break glass: runbooks/kyverno.md.
config:
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, argocd, edge]

features:
  # Policies set their own failurePolicy (Fail for the Enforce ones); forceFailurePolicyIgnore is off since P3.5.
  backgroundScan:
    enabled: true
    backgroundScanWorkers: 1
    backgroundScanInterval: 1h
  policyExceptions:
    enabled: false
  logging:
    format: json

# Hooks not needed here: the legacy-policy check (fresh v1.20 install) and the pre-delete webhook cleanup (with
# failurePolicy Ignore a leftover webhook can't block anything; runbooks/kyverno.md says how to remove one).
# Helm test pods are skipped by Argo CD.
upgrade:
  legacyPolicyCheck:
    enabled: false
webhooksCleanup:
  enabled: false

admissionController:
  # Two replicas, one per Spark (hard spread), so a GPU OOM on one Spark doesn't stop admission. The PDB keeps one.
  replicas: 2
  revisionHistoryLimit: 3
  nodeSelector:
    nghodki.ai/role: gpu
  antiAffinity:
    enabled: false
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller
          app.kubernetes.io/instance: kyverno
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  initContainer:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 384Mi}

reportsController:
  enabled: true
  replicas: 1
  revisionHistoryLimit: 3
  nodeSelector:
    nghodki.ai/role: gpu
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Generate / mutate-existing and cleanup policies aren't used yet.
backgroundController:
  enabled: false
cleanupController:
  enabled: false

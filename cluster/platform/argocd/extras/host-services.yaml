# Fixed ClusterIPs in the static band (10.43.0.0-10.43.0.255, see cluster/README.md) so Docker services on the
# nodes can reach them without a NodePort on the LAN: kube-proxy on every node routes ClusterIPs for host traffic.
#   edge-caddy on dgx-1  -> 10.43.0.100:80   (argocd.nghodki.ai)
#   VictoriaMetrics dgx-2 -> 10.43.0.100:8083 (server), 10.43.0.101:8082 (application controller),
#                            10.43.0.102:8084 (repo-server)
# server and repo-server run 2 replicas (one per Spark). ClientIP affinity keeps each client on one replica, so a
# scrape sees the same pod every time (no counters flipping between two pods); when that pod goes, kube-proxy drops
# its endpoint and the client lands on the other one. The in-cluster Caddy pods are spread over both replicas.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-host
  namespace: argocd
spec:
  type: ClusterIP
  clusterIP: 10.43.0.100
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - {name: http, port: 80, targetPort: 8080, protocol: TCP}
    - {name: metrics, port: 8083, targetPort: 8083, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-controller-host
  namespace: argocd
spec:
  type: ClusterIP
  clusterIP: 10.43.0.101
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-application-controller
  ports:
    - {name: metrics, port: 8082, targetPort: 8082, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-repo-server-host
  namespace: argocd
spec:
  type: ClusterIP
  clusterIP: 10.43.0.102
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-repo-server
  ports:
    - {name: metrics, port: 8084, targetPort: 8084, protocol: TCP}

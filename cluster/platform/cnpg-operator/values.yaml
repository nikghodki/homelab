# CloudNativePG operator: chart cloudnative-pg 0.29.1 (CNPG 1.30.1), namespace cnpg-system. Operator only, no
# Postgres clusters yet (P3.7 adds one in `data`). Used by cluster/bootstrap/apps/cnpg-operator.yaml.
replicaCount: 1
crds:
  create: true
config:
  clusterWide: true
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
nodeSelector:
  nghodki.ai/role: gpu
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false

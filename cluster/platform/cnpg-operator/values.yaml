# CloudNativePG operator: chart cloudnative-pg 0.29.1 (CNPG 1.30.1), namespace cnpg-system. Operator; clusters: `ops/ops-db`
# (the ops agent, decision 0013); P3.7 adds one in `data`. Used by cluster/bootstrap/apps/cnpg-operator.yaml.
replicaCount: 1
# The operator injects its own image into every Postgres pod and bootstrap Job (the instance manager / bootstrap
# controller, env OPERATOR_IMAGE_NAME). Kyverno's require-image-digest refuses a tag there, so the image carries
# the digest of the chart's appVersion (1.30.1). Bump tag and digest together with the chart.
image:
  repository: ghcr.io/cloudnative-pg/cloudnative-pg
  tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
crds:
  create: true
config:
  clusterWide: true
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
nodeSelector:
  nghodki.ai/role: gpu
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false

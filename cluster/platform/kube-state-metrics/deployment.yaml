# kube-state-metrics v2.20.0: pod/deployment/daemonset/node readiness for vmalert (hosts/stacks/observe), scraped by
# VictoriaMetrics on dgx-2 at the fixed ClusterIP 10.43.0.120:8080 (cluster/README.md). Only the resources the
# alerts need, so it stays small.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector: {nghodki.ai/role: gpu}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --resources=daemonsets,deployments,nodes,pods,statefulsets,replicasets
            - --port=8080
            - --telemetry-port=8081
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http-metrics}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-host
  namespace: kube-system
spec:
  type: ClusterIP
  clusterIP: 10.43.0.120
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: http-metrics, port: 8080, targetPort: http-metrics}

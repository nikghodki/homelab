# kube-vip v1.3.1 (decision 0007): ARP on the Sparks' Wi-Fi (wlP9s9).
#   - control plane: 192.168.86.10 (k8s.nghodki.ai on the LAN) on the leader of lease kube-system/plndr-cp-lock
#   - services: LoadBalancer IPs from the `kube-vip.io/loadbalancerIPs` annotation (edge VIP 192.168.86.11), on the
#     leader of kube-system/plndr-svcs-lock
# hostNetwork + NET_ADMIN/NET_RAW (not privileged): it adds the VIP to the host interface and sends gratuitous ARP.
# That is why it lives in kube-system (allowlisted for host namespaces in policies/kyverno/disallow-privileged.yaml).
# Metrics on the node's cable address only (10.100.136.x:2112), not the LAN or the tailnet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels: {app.kubernetes.io/name: kube-vip, app.kubernetes.io/part-of: edge}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: kube-vip}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-vip, app.kubernetes.io/part-of: edge}
    spec:
      serviceAccountName: kube-vip
      # The VIPs live on the host interface (decision 0007; Kyverno allowlists kube-system, Trivy: .trivyignore.yaml).
      hostNetwork: true  # nosemgrep: yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {nghodki.ai/role: gpu}
      terminationGracePeriodSeconds: 10
      # Root: Kubernetes grants added capabilities only to uid 0 (no ambient capabilities for other users).
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
          args: ["manager"]
          env:
            - {name: vip_arp, value: "true"}
            - {name: vip_interface, value: wlP9s9}
            - {name: vip_subnet, value: "32"}
            - name: vip_nodename
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: port, value: "6443"}
            - {name: address, value: 192.168.86.10}
            - {name: cp_enable, value: "true"}
            - {name: cp_namespace, value: kube-system}
            - {name: svc_enable, value: "true"}
            - {name: svc_leasename, value: plndr-svcs-lock}
            - {name: vip_leaderelection, value: "true"}
            - {name: vip_leasename, value: plndr-cp-lock}
            # Lease timing: a dead leader is replaced within ~10 s; renewals go to the local API server over the cable.
            - {name: vip_leaseduration, value: "10"}
            - {name: vip_renewdeadline, value: "7"}
            - {name: vip_retryperiod, value: "2"}
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: prometheus_server, value: "$(NODE_IP):2112"}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [NET_ADMIN, NET_RAW]
              drop: [ALL]

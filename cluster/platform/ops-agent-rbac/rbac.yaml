# The ops agent's Kubernetes reader (decision 0013, design §5.1/§9.4): get/list/watch on what an investigation needs,
# and nothing that reveals secrets or gives a shell. RBAC can't say "everything except", so the list is explicit:
# no secrets, no serviceaccounts/token, no pods/exec|attach|portforward|proxy, no nodes/proxy, no services/proxy.
# The ServiceAccount lives in the ops app (cluster/apps/ops); kubernetes-mcp-server and ops-ingest use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, services, endpoints, configmaps, events, nodes, nodes/status, namespaces,
                persistentvolumeclaims, persistentvolumes, replicationcontrollers, serviceaccounts, limitranges,
                resourcequotas, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, discovery.k8s.io, events.k8s.io, storage.k8s.io,
                scheduling.k8s.io, node.k8s.io, coordination.k8s.io, apiextensions.k8s.io, metrics.k8s.io,
                admissionregistration.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io, policies.kyverno.io, wgpolicyk8s.io, reports.kyverno.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups, poolers, databases]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-agent-read
subjects:
  - kind: ServiceAccount
    name: ops-agent-read
    namespace: ops

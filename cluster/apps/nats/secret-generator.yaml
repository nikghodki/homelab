# KSOPS. nats-tls: the Docker server's client certificate (hosts/files/pki/nats.crt) and key (pki_nats_key in
# secrets/pki.enc.yaml). nats-auth: passwords.conf, the users' bcrypt hashes from secrets/bus.enc.yaml as NATS
# variables. nats-route: the route key (its CA's key was discarded; runbooks/nats.md, "Certificates").
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: nats-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./nats-tls.enc.yaml
  - ./nats-auth.enc.yaml
  - ./nats-route.enc.yaml

# NATS in k3s: 3 servers (dgx-1, dgx-2, the Jetson), JetStream R3, MQTT over TLS (decision 0014, runbooks/nats.md).
# The same accounts, users and permissions as the Docker server (hosts/stacks/bus/nats/nats.conf.j2): keep the two
# identical until the Docker server is retired. Only the password hashes are secret: they are variables from
# passwords.conf (KSOPS Secret nats-auth, from secrets/bus.enc.yaml), so the permissions stay reviewable here.
include "passwords.conf"

server_name: $POD_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB
pid_file: "/var/run/nats/nats.pid"
# A rolling restart: stop taking clients, hand them to the other servers over 30 s (they reconnect via the VIP).
lame_duck_duration: 30s
lame_duck_grace_period: 10s

# Client TLS: the Docker server's certificate and key (hosts/files/pki/nats.crt, pki_nats_key). Clients connect by
# name (nats.nghodki.ai, in the SAN), so the VIP and the Sparks' Tailscale IPs need no new certificate.
tls {
  cert_file: "/etc/nats/tls/tls.crt"
  key_file: "/etc/nats/tls/tls.key"
  timeout: 2
}

# Routes between the three servers: mutual TLS with a CA used for nothing else (route-ca.crt), so no other
# certificate of the homelab CA can join the cluster (a route bypasses every user and permission).
cluster {
  name: homelab-bus
  listen: 0.0.0.0:6222
  # Clients outside the cluster can't reach pod IPs: don't hand them out in INFO (connect_urls).
  no_advertise: true
  advertise: $ROUTE_ADVERTISE
  routes: [
    "tls://nats-0.nats-headless.nats.svc.cluster.local:6222"
    "tls://nats-1.nats-headless.nats.svc.cluster.local:6222"
    "tls://nats-2.nats-headless.nats.svc.cluster.local:6222"
  ]
  connect_retries: 120
  tls {
    cert_file: "/etc/nats/route/route.crt"
    key_file: "/etc/nats/route/route.key"
    ca_file: "/etc/nats/route/route-ca.crt"
    verify: true
    timeout: 3
  }
}

# Small limits: the Jetson has ~2.3 GiB for pods, and every R3 stream is stored on all three servers.
# In use on 2026-11-16: only the MQTT assets ($MQTT_sess with 2 sessions, 753 bytes).
jetstream {
  store_dir: "/data"
  max_memory_store: 64MB
  max_file_store: 2GB
}

mqtt {
  port: 8883
  # The MQTT gateway's own JetStream streams (sessions, retained messages, QoS 1/2) on all three; their consumers
  # follow the stream (2.15 ignores consumer_replicas).
  stream_replicas: 3
  tls {
    cert_file: "/etc/nats/tls/tls.crt"
    key_file: "/etc/nats/tls/tls.key"
    timeout: 2
  }
}

accounts {
  FLEET: {
    jetstream: enabled
    users: [
      {user: admin, password: $NATS_ADMIN_PASSWORD_HASH}
      # picoclaw (Pi) over MQTT. MQTT topic /picoclaw/... is the NATS subject /.picoclaw...
      # Agents may latch the e-stop but never clear it: the reset subjects are the operator's only
      # (runbooks/robot-safety.md). Deny wins over allow, for MQTT publishes too.
      {user: picoclaw, password: $NATS_PICOCLAW_PASSWORD_HASH,
       permissions: {
         publish: {allow: ["/.picoclaw.>", "robot.pi.>", "$MQTT.>"],
                   deny: ["robot.pi.safety.reset", "robot.pi.safety.test.reset"]},
         subscribe: {allow: ["/.picoclaw.>", "robot.pi.cmd.>", "robot.pi.safety.>", "$MQTT.>", "_INBOX.>"]}
       }}
      # Hermes (Jetson): may command the robot and use its own subjects
      {user: hermes, password: $NATS_HERMES_PASSWORD_HASH,
       permissions: {
         publish: {allow: ["/.picoclaw.>", "robot.>", "agents.hermes.>", "home.>", "$MQTT.>", "_INBOX.>"],
                   deny: ["robot.pi.safety.reset", "robot.pi.safety.test.reset"]},
         subscribe: {allow: ["/.picoclaw.>", "robot.>", "agents.hermes.>", "home.>", "$MQTT.>", "_INBOX.>"]}
       }}
      # The human: safety-reset / safety-estop on dgx-1 and the Pi. Only this user (and admin) can clear the e-stop.
      {user: operator, password: $NATS_OPERATOR_PASSWORD_HASH,
       permissions: {
         publish: {allow: ["robot.pi.safety.reset", "robot.pi.safety.estop",
                           "robot.pi.safety.test.reset", "robot.pi.safety.test.estop"]},
         subscribe: {allow: ["robot.pi.safety.>"]}
       }}
    ]
  }
  SYS: {
    users: [{user: sys, password: $NATS_SYS_PASSWORD_HASH}]
  }
}
system_account: SYS

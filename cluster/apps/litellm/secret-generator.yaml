# litellm: the proxy's keys and passwords (from secrets/litellm.enc.yaml and secrets/console.enc.yaml, rebuilt by the
# script in runbooks/litellm.md "Secrets"). litellm-redis: Redis's requirepass (the same value as REDIS_PASSWORD).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: litellm-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./litellm.enc.yaml
  - ./litellm-redis.enc.yaml

# litellm-db-app: the owner `litellm` of database litellm (CNPG initdb), the same password as in the LiteLLM
# pods' DATABASE_URL (cluster/apps/litellm/litellm.enc.yaml); source: litellm_db_password in secrets/litellm.enc.yaml.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: data-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./litellm-db.enc.yaml

# pocket-id: encryption_key (encrypts what Pocket ID stores; must stay the same, or the data can't be read) and
# static_api_key (pocketid_sync.py), copied from secrets/console.enc.yaml (pocketid_encryption_key, pocketid_static_api_key).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: pocket-id-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./pocket-id.enc.yaml

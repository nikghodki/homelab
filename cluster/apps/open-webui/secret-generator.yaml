# WEBUI_SECRET_KEY (session signing; must stay the same or everyone is signed out) and OPENAI_API_KEY (the LiteLLM
# virtual key "open-webui"), copied from the Docker copy's ~/open-webui/.env.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: open-webui-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./open-webui.enc.yaml

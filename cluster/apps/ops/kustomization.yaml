# The ops agent (decision 0013, runbooks/ops-agent.md). Shadow mode: read-only everywhere.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - database.yaml
  - mcp-servers.yaml
  - networkpolicies.yaml
  - agent.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: ops-mode
    files:
      - mode.yaml=mode.txt
  - name: ops-known-hosts
    files:
      - known_hosts
  - name: mcp-kubernetes
    files:
      - mcp-kubernetes.toml

# Fleet inventory. Run from dgx-1 (the control node), from this folder.
# Addresses are LAN IPs until DHCP reservations / Tailscale names are in place (plan P0.9).
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    sparks:
      hosts:
        dgx-1:
          ansible_connection: local
          ansible_user: nikghodki-dgx
        dgx-2:
          ansible_host: 192.168.86.36
          ansible_user: nikghodki-dgx-2
    jetson_group:
      hosts:
        jetson:
          ansible_host: 192.168.86.211
          ansible_user: nikjetson
    agent_nodes:
      hosts:
        omarchy:
          ansible_host: 192.168.86.49
          ansible_user: nikghodki
    # k3s (plan P3.2, runbooks/k3s.md). dgx-2 starts the cluster; the others join it one at a time.
    k3s:
      children:
        k3s_servers:
          hosts:
            dgx-2:
            dgx-1:
            jetson:
        k3s_agents:
          hosts:
            omarchy:
    k3s_init:
      hosts:
        dgx-2:
    # The Dell never sleeps and runs the alerting path and the ops launcher (runbooks/alerting.md).
    always_on:
      hosts:
        omarchy:
    alerting:
      hosts:
        omarchy:
    bus:
      hosts:
        dgx-1:
    # LiteLLM, the model/MCP/A2A gateway (runbooks/litellm.md)
    litellm:
      hosts:
        dgx-1:
    observe:
      hosts:
        dgx-2:
    # restic rest-server and the server-side prune (playbooks/backups.yml; user decision 2026-11-16, decision 0002)
    backup_server:
      hosts:
        jetson:
    edge:
      hosts:
        pi:
          ansible_host: 192.168.86.39
          ansible_user: nikghodki-raspberry-1

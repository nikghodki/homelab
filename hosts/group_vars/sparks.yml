# DGX Sparks (dgx-1, dgx-2)
# dcgm-exporter from playbooks/gpu.yml, scraped locally and pushed with the host's other metrics.
sparks_extra_scrapes:
  - {job: dcgm-exporter, target: "127.0.0.1:9400"}
otel_host_collector_extra_scrapes: "{{ sparks_extra_scrapes }}"
# k3s servers with embedded etcd (plan P3.2). Node IP on the 200 Gb/s link; LAN IP as the external IP.
k3s_role: server
k3s_flannel_iface: enp1s0f0np0
k3s_lan_iface: wlP9s9
k3s_node_labels: [nghodki.ai/role=gpu, nghodki.ai/hw=gb10]
# Scheduling budget only: the DGXMM engines run in Docker and are not counted by the kubelet.
k3s_kubelet_args:
  - system-reserved=cpu=2,memory=8Gi,ephemeral-storage=20Gi
  - kube-reserved=cpu=1,memory=2Gi,ephemeral-storage=5Gi
# A dead node's pods leave the Services after 20 s instead of Kubernetes' 50 s (runbooks/edge.md "Failover drill":
# until then the surviving Spark still sends part of the front door's connections to the dead pods).
k3s_kube_controller_manager_args: [node-monitor-grace-period=20s]
# Cisco AIBOM (runbooks/aibom.md). A model can take most of the unified memory: cap the job and skip image scans
# when little is left (both Sparks crashed from memory exhaustion on 2026-11-15).
cisco_aibom_memory_max: 6G
cisco_aibom_image_min_mem_gib: 20
# The front door's access log (runbooks/edge.md, "Access log"): edge-caddy runs one pod per Spark.
otel_host_collector_pod_logs:
  - {service: edge-caddy, namespace: edge, pod_prefix: edge-caddy, container: caddy}

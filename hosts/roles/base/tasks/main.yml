- name: Check the OS is one we support
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian', 'Archlinux']
    fail_msg: "Unsupported OS family {{ ansible_facts['os_family'] }}"

- name: Set the time zone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Cap the journal size
  ansible.builtin.template:
    src: journald-homelab.conf.j2
    dest: /etc/systemd/journald.conf.d/50-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-homelab.conf.j2
    dest: /etc/ssh/sshd_config.d/50-homelab.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Security-only automatic upgrades (Debian/Ubuntu)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - base_unattended_security_upgrades | bool
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
    - name: Configure security-only upgrades without automatic reboot
      ansible.builtin.template:
        src: 52homelab-unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
        owner: root
        group: root
        mode: "0644"

- name: Config folder
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Repository credentials
  ansible.builtin.template:
    src: env.j2
    dest: /etc/restic/env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Paths to back up
  ansible.builtin.copy:
    dest: /etc/restic/paths
    content: "{{ (restic_backup_paths + ['/var/backups/homelab']) | join('\n') }}\n"
    mode: "0600"

- name: Excludes
  ansible.builtin.copy:
    dest: /etc/restic/excludes
    content: "{{ (restic_backup_excludes + restic_backup_default_excludes) | join('\n') }}\n"
    mode: "0600"

- name: SQLite snapshot helper
  ansible.builtin.copy:
    src: sqlite-snapshot.py
    dest: /etc/restic/sqlite-snapshot.py
    mode: "0700"

- name: Pre-backup hook
  ansible.builtin.template:
    src: pre-backup.sh.j2
    dest: /etc/restic/pre-backup.sh
    mode: "0700"

- name: Service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [homelab-backup.service, homelab-backup.timer]

- name: Repository exists
  ansible.builtin.shell: |
    set -o pipefail
    set -a; . /etc/restic/env; set +a
    /usr/local/bin/restic cat config >/dev/null 2>&1 && echo exists || { /usr/local/bin/restic init >/dev/null && echo created; }
  args:
    executable: /bin/bash
  register: restic_backup_init
  changed_when: "'created' in restic_backup_init.stdout"
  when: not ansible_check_mode
  no_log: true

- name: Timer is enabled
  ansible.builtin.systemd_service:
    name: homelab-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

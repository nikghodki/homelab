- name: Pick the release architecture
  ansible.builtin.set_fact:
    otel_host_collector_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts['architecture']] }}"

- name: Is this version already installed
  ansible.builtin.stat:
    path: "/opt/otelcol-contrib/{{ otel_host_collector_version }}/otelcol-contrib"
  register: otel_host_collector_installed

- name: First install in check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: would install otelcol-contrib {{ otel_host_collector_version }} and start it"
  when: ansible_check_mode and not otel_host_collector_installed.stat.exists

- name: Install, configure and run the collector
  # A first install cannot be simulated in check mode (user, folders and binary do not exist yet).
  when: not (ansible_check_mode and not otel_host_collector_installed.stat.exists)
  block:
    - name: Collector user
      ansible.builtin.user:
        name: otelcol
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        groups: [systemd-journal]
        append: true

    - name: Install folder
      ansible.builtin.file:
        path: "/opt/otelcol-contrib/{{ otel_host_collector_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download and unpack the collector
      block:
        - name: Download the collector (checked against the release's .sha256 file)
          ansible.builtin.get_url:
            url: "{{ otel_host_collector_release_url }}/{{ otel_host_collector_tarball }}"
            checksum: "sha256:{{ lookup('ansible.builtin.url', otel_host_collector_release_url ~ '/' ~ otel_host_collector_tarball ~ '.sha256') | trim }}"
            dest: "/opt/otelcol-contrib/{{ otel_host_collector_version }}/otelcol-contrib.tar.gz"
            owner: root
            group: root
            mode: "0644"

        - name: Unpack
          ansible.builtin.unarchive:
            src: "/opt/otelcol-contrib/{{ otel_host_collector_version }}/otelcol-contrib.tar.gz"
            dest: "/opt/otelcol-contrib/{{ otel_host_collector_version }}"
            remote_src: true
            include: [otelcol-contrib]
            creates: "/opt/otelcol-contrib/{{ otel_host_collector_version }}/otelcol-contrib"
          notify: Restart otelcol

    - name: Current version link
      ansible.builtin.file:
        src: "/opt/otelcol-contrib/{{ otel_host_collector_version }}/otelcol-contrib"
        dest: /usr/local/bin/otelcol-contrib
        state: link
      notify: Restart otelcol

    - name: Config folder
      ansible.builtin.file:
        path: /etc/otelcol-contrib
        state: directory
        owner: root
        group: otelcol
        mode: "0750"

    - name: Config
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/otelcol-contrib/config.yaml
        owner: root
        group: otelcol
        mode: "0640"
      notify: Restart otelcol

    - name: Credentials folder (root only)
      ansible.builtin.file:
        path: /etc/otelcol-contrib/credentials
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Credentials (passed to the service with LoadCredential)
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/etc/otelcol-contrib/credentials/{{ item.key }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ otel_host_collector_credentials | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      notify: Restart otelcol

    - name: Pod log access (POSIX ACLs, read-only)
      when: otel_host_collector_pod_logs | length > 0
      block:
        # /var/log/pods is 0750 root: the collector may list it, and new pod folders and log files inherit read.
        - name: Pod log folder ACL for the collector
          ansible.posix.acl:
            path: /var/log/pods
            entity: otelcol
            etype: user
            permissions: rx
            default: "{{ item }}"
            state: present
          loop: [false, true]

        - name: Find the existing log folders and files of the shipped pods
          ansible.builtin.find:
            paths: /var/log/pods
            recurse: true
            file_type: any
          register: otel_host_collector_pod_files

        - name: The shipped pods' folders and files among them
          ansible.builtin.set_fact:
            otel_host_collector_pod_paths: >-
              {{ otel_host_collector_pod_files.files | selectattr('path', 'match', otel_host_collector_pod_logs_regex) }}
          vars:
            # /var/log/pods/<namespace>_<pod_prefix>-<hash>_<uid>[/<container>[/<n>.log]]
            otel_host_collector_pod_logs_regex: >-
              ^/var/log/pods/({% for p in otel_host_collector_pod_logs %}{{ p.namespace }}_{{ p.pod_prefix
              }}{{ '|' if not loop.last }}{% endfor %})-[^/]+(/[^/]+(/[^/]+\.log)?)?$

        # Existing ones only: new pod folders and files inherit the ACL from /var/log/pods.
        - name: Existing pod log folders readable by the collector
          ansible.posix.acl:
            path: "{{ item.0.path }}"
            entity: otelcol
            etype: user
            permissions: rx
            default: "{{ item.1 }}"
            state: present
          loop: "{{ otel_host_collector_pod_paths | selectattr('isdir') | product([false, true]) }}"
          loop_control:
            label: "{{ item.0.path }}{{ ' (default)' if item.1 else '' }}"

        - name: Existing pod log files readable by the collector
          ansible.posix.acl:
            path: "{{ item.path }}"
            entity: otelcol
            etype: user
            permissions: r
            state: present
          loop: "{{ otel_host_collector_pod_paths | rejectattr('isdir') }}"
          loop_control:
            label: "{{ item.path }}"

    - name: Service unit
      ansible.builtin.template:
        src: otelcol-contrib.service.j2
        dest: /etc/systemd/system/otelcol-contrib.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart otelcol

    - name: Collector is enabled and running
      ansible.builtin.systemd_service:
        name: otelcol-contrib
        enabled: true
        state: started
        daemon_reload: true

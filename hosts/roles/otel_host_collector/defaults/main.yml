otel_host_collector_version: 0.165.0
otel_host_collector_memory_max: 256M
otel_host_collector_endpoint: ""
# Scrape the local fleet-metrics exporter when the host runs it.
otel_host_collector_scrape_fleet_metrics: true
otel_host_collector_fleet_metrics_port: "{{ fleet_metrics_port | default(9109) }}"
# More local Prometheus endpoints to scrape: [{job, target, path?, interval?, bearer_token_file?}]
# bearer_token_file is read by the otelcol user; for a secret, use otel_host_collector_credentials.
otel_host_collector_extra_scrapes: []
otel_host_collector_release_url: >-
  https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_host_collector_version }}
otel_host_collector_tarball: "otelcol-contrib_{{ otel_host_collector_version }}_linux_{{ otel_host_collector_arch }}.tar.gz"
# Root-only secrets handed to the collector with systemd LoadCredential: {name: value}.
# Each one is readable by the service at /run/credentials/otelcol-contrib.service/<name>.
otel_host_collector_credentials: {}

---
# Hermes starts its MCP servers when it starts, so a running Hermes keeps the old file until it restarts.
- name: Restart Hermes
  become: true
  become_user: "{{ item }}"
  ansible.builtin.systemd_service:
    name: "{{ hermes_robot_mcp_gateway_unit }}"
    scope: user
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[item][1] }}"
  loop: "{{ hermes_robot_mcp_readers }}"
  when: not ansible_check_mode

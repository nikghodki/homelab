---
# Hermes' copy of the picoclaw-hardware MCP server on the Jetson (MCP server picoclaw_only of hermes-nikhil;
# runbooks/robot-safety.md, runbooks/hermes-profiles.md). Its motion tools are sent to PicoClaw on the Pi over
# MQTT/NATS, so every move goes through the robot's safety governor. nikjetson's roboclaw folder is not a git
# repository, so the change is a patch to the user's file, as role picoclaw does on the Pi.
hermes_robot_mcp_owner: nikjetson
hermes_robot_mcp_dir: /home/nikjetson/workspace/roboclaw/mcp-server
hermes_robot_mcp_file: "{{ hermes_robot_mcp_dir }}/picoclaw-hardware-mcp.js"
# Accounts that run the file through Hermes (read-only ACL), and whose Hermes restarts when it changes
hermes_robot_mcp_readers: [hermes-nikhil]
hermes_robot_mcp_gateway_unit: hermes-gateway

# The user's original (the same file as the Pi's picoclaw-hardware-mcp.js.pre-governor) and the patched file. The
# Pi's motion integration test (run-hermes-motion-integration-test) builds the patched file from the same original
# with the same patch and checks the same hash, so the test runs exactly the code deployed here.
hermes_robot_mcp_original_sha256: b19cdeb9535dbe793f1dd752c7b7575b5d48e892e7b6fb883b58b922f7a4a4d5
hermes_robot_mcp_patched_sha256: 0ed1f77f34c3cfaa00210f83881d9da848526fba6a05ee1da30c05f4b39856ea

# The direct-motion guard: one pattern, shared with the nightly mcp-drift check (drift_check.picoclaw_only).
hermes_robot_mcp_policy: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../policies/defenseclaw/mcp-servers.yaml') | from_yaml }}"
hermes_robot_mcp_forbidden: "{{ hermes_robot_mcp_policy.drift_check.picoclaw_only.forbidden_source.pattern }}"

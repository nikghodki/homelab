---
- name: Accounts to manage
  ansible.builtin.set_fact:
    defenseclaw_policy_accounts: "{{ defenseclaw_policy_users if defenseclaw_policy_users | length > 0 else [ansible_facts['user_id']] }}"

- name: Account home folders
  ansible.builtin.getent:
    database: passwd

- name: Fleet DefenseClaw policy for each account
  ansible.builtin.include_tasks: account.yml
  loop: "{{ defenseclaw_policy_accounts }}"
  loop_control:
    loop_var: defenseclaw_policy_account

---
- name: "Fleet policy, skipped where the CLI is absent, for {{ defenseclaw_policy_account }}"
  become: "{{ defenseclaw_policy_account != ansible_facts['user_id'] }}"
  become_user: "{{ defenseclaw_policy_account }}"
  vars:
    defenseclaw_policy_home: "{{ ansible_facts.getent_passwd[defenseclaw_policy_account][4] }}"
    defenseclaw_policy_cli: "{{ defenseclaw_policy_home }}/.local/bin/defenseclaw"
    defenseclaw_policy_dest: "{{ defenseclaw_policy_home }}/.defenseclaw/policies/{{ defenseclaw_policy_name }}.yaml"
  block:
    - name: Look for the DefenseClaw CLI
      ansible.builtin.stat:
        path: "{{ defenseclaw_policy_cli }}"
      register: defenseclaw_policy_cli_stat

    - name: Policy file and activation
      when: defenseclaw_policy_cli_stat.stat.exists
      block:
        - name: Policy file
          ansible.builtin.copy:
            src: "{{ defenseclaw_policy_src }}"
            dest: "{{ defenseclaw_policy_dest }}"
            mode: "0600"
          register: defenseclaw_policy_file

        - name: Active policy
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy list"
          register: defenseclaw_policy_list
          changed_when: false
          check_mode: false

        - name: Activate the policy (gateway reloads it)
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy activate {{ defenseclaw_policy_name }}"
          when: >-
            defenseclaw_policy_file is changed or
            defenseclaw_policy_list.stdout is not search('\* ' ~ defenseclaw_policy_name ~ ' .*\[active\]')
          changed_when: true

        - name: Validate rule files and Rego
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy validate"
          changed_when: false
          check_mode: false

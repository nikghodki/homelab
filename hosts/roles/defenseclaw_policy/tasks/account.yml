---
- name: "Fleet policy, skipped where the CLI is absent, for {{ defenseclaw_policy_account }}"
  become: "{{ defenseclaw_policy_account != ansible_facts['user_id'] }}"
  become_user: "{{ defenseclaw_policy_account }}"
  vars:
    defenseclaw_policy_home: "{{ ansible_facts.getent_passwd[defenseclaw_policy_account][4] }}"
    defenseclaw_policy_cli: "{{ defenseclaw_policy_home }}/.local/bin/defenseclaw"
    defenseclaw_policy_dest: "{{ defenseclaw_policy_home }}/.defenseclaw/policies/{{ defenseclaw_policy_name }}.yaml"
  block:
    - name: Look for the DefenseClaw CLI
      ansible.builtin.stat:
        path: "{{ defenseclaw_policy_cli }}"
      register: defenseclaw_policy_cli_stat

    - name: Policy file and activation
      when: defenseclaw_policy_cli_stat.stat.exists
      block:
        - name: Policy file
          ansible.builtin.copy:
            src: "{{ defenseclaw_policy_src }}"
            dest: "{{ defenseclaw_policy_dest }}"
            mode: "0600"
          register: defenseclaw_policy_file

        - name: Active policy
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy list"
          register: defenseclaw_policy_list
          changed_when: false
          check_mode: false

        - name: Activate the policy (gateway reloads it)
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy activate {{ defenseclaw_policy_name }}"
          when: >-
            defenseclaw_policy_file is changed or
            defenseclaw_policy_list.stdout is not search('\* ' ~ defenseclaw_policy_name ~ ' .*\[active\]')
          changed_when: true

        - name: Validate rule files and Rego
          ansible.builtin.command: "{{ defenseclaw_policy_cli }} policy validate"
          changed_when: false
          check_mode: false

        # The Git file holds only the settings it manages; the rest of asset_policy (for example a skill block
        # list written by `defenseclaw skill block`) is kept. One write through DefenseClaw's config writer, which
        # validates it and has the gateway reload it.
        - name: MCP admission from Git (asset_policy)
          when: defenseclaw_policy_mcp_admission | bool
          vars:
            defenseclaw_policy_mcp_want: "{{ (lookup('ansible.builtin.file', defenseclaw_policy_mcp_src) | from_yaml).asset_policy }}"
          block:
            - name: Current asset_policy
              ansible.builtin.command: "{{ defenseclaw_policy_cli }} config get asset_policy --format json"
              register: defenseclaw_policy_asset_now
              changed_when: false
              check_mode: false

            - name: Merge the approved MCP servers and admission settings
              vars:
                defenseclaw_policy_asset_cur: "{{ defenseclaw_policy_asset_now.stdout | from_json }}"
                defenseclaw_policy_asset_new: "{{ defenseclaw_policy_asset_cur | combine(defenseclaw_policy_mcp_want, recursive=True) }}"
              ansible.builtin.command:
                argv:
                  - "{{ defenseclaw_policy_cli }}"
                  - config
                  - set
                  - --json
                  - asset_policy
                  - "{{ defenseclaw_policy_asset_new | to_json }}"
              when: defenseclaw_policy_asset_new != defenseclaw_policy_asset_cur
              changed_when: true

            - name: Validate the config
              ansible.builtin.command: "{{ defenseclaw_policy_cli }} config validate"
              changed_when: false
              check_mode: false

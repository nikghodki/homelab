- name: LiteLLM usage exporter
  when: litellm_usage_exporter_enabled | bool
  block:
    - name: The DB role needs its password (secrets/observe.enc.yaml)
      ansible.builtin.assert:
        that: litellm_usage_exporter_db_password | length >= 24
        fail_msg: litellm_usage_exporter_db_password missing or short (secrets/observe.enc.yaml)
        quiet: true
      no_log: true

    - name: Postgres driver
      ansible.builtin.apt:
        name: python3-psycopg2
        state: present

    - name: Folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ litellm_usage_exporter_prefix }}", mode: "0755"}
        - {path: /etc/litellm-usage-exporter, mode: "0700"}

    - name: Exporter
      ansible.builtin.copy:
        src: litellm-usage-exporter.py
        dest: "{{ litellm_usage_exporter_prefix }}/litellm-usage-exporter"
        owner: root
        group: root
        mode: "0755"
      notify: Restart litellm-usage-exporter

    - name: DB password (root only; handed to the service with LoadCredential)
      ansible.builtin.copy:
        dest: /etc/litellm-usage-exporter/db-password
        content: "{{ litellm_usage_exporter_db_password }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart litellm-usage-exporter

    - name: Read-only role SQL (root only; contains the password)
      ansible.builtin.template:
        src: litellm-usage-ro.sql.j2
        dest: /etc/litellm-usage-exporter/role.sql
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: litellm_usage_exporter_role_sql

    - name: Grants the read-only role has (CNPG primary, as postgres)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          P=$(k3s kubectl -n {{ litellm_usage_exporter_db_namespace }} get pod
          -l cnpg.io/cluster={{ litellm_usage_exporter_db_cluster }},cnpg.io/instanceRole=primary -o name);
          k3s kubectl -n {{ litellm_usage_exporter_db_namespace }} exec $P -c postgres --
          psql -Atq -U postgres -d {{ litellm_usage_exporter_db_name }} -c
          "select count(*) from information_schema.column_privileges where grantee = '{{ litellm_usage_exporter_db_role }}'"
        executable: /bin/bash
      register: litellm_usage_exporter_grants
      changed_when: false
      check_mode: false

    # After a restore (no roles or privileges come with it) or a change of the SQL
    - name: Create or update the read-only role (SQL on stdin, so the password is not in the process list)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          P=$(k3s kubectl -n {{ litellm_usage_exporter_db_namespace }} get pod
          -l cnpg.io/cluster={{ litellm_usage_exporter_db_cluster }},cnpg.io/instanceRole=primary -o name);
          k3s kubectl -n {{ litellm_usage_exporter_db_namespace }} exec -i $P -c postgres --
          psql -q -U postgres -d {{ litellm_usage_exporter_db_name }} -v ON_ERROR_STOP=1
          < /etc/litellm-usage-exporter/role.sql
        executable: /bin/bash
      changed_when: true
      when: >-
        not ansible_check_mode and (litellm_usage_exporter_role_sql is changed or
        (litellm_usage_exporter_grants.stdout | int) != (litellm_usage_exporter_db_grants.values() | map('length') | sum))
      notify: Restart litellm-usage-exporter

    - name: Service
      ansible.builtin.template:
        src: litellm-usage-exporter.service.j2
        dest: /etc/systemd/system/litellm-usage-exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart litellm-usage-exporter

    - name: Service is enabled and running
      ansible.builtin.systemd_service:
        name: litellm-usage-exporter.service
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

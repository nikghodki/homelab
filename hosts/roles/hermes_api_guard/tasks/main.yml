---
# Only Open WebUI (dgx-1) and loopback reach Hermes' API server on the Jetson (runbooks/open-webui.md, "Hermes").
# Loads its own nftables table; does not restart Hermes.
- name: Directory for the rule
  ansible.builtin.file:
    path: "{{ hermes_api_guard_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Rule file
  ansible.builtin.template:
    src: hermes-api-guard.nft.j2
    dest: "{{ hermes_api_guard_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the Hermes API guard

- name: Unit
  ansible.builtin.template:
    src: hermes-api-guard.service.j2
    dest: /etc/systemd/system/hermes-api-guard.service
    owner: root
    group: root
    mode: "0644"
  register: hermes_api_guard_unit
  notify:
    - Reload systemd
    - Reload the Hermes API guard

- name: Flush handlers (systemd sees the unit, the rule is current)
  ansible.builtin.meta: flush_handlers

- name: Unit is enabled and started
  ansible.builtin.systemd_service:
    name: hermes-api-guard.service
    enabled: true
    state: started
  when: not (ansible_check_mode and hermes_api_guard_unit is changed)

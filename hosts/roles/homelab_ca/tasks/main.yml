- name: Homelab CA in the Debian/Ubuntu trust store
  ansible.builtin.copy:
    src: "{{ homelab_ca_cert }}"
    dest: /usr/local/share/ca-certificates/homelab-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'
  notify: Update CA trust (Debian)

- name: Homelab CA in the Arch trust store
  ansible.builtin.copy:
    src: "{{ homelab_ca_cert }}"
    dest: /etc/ca-certificates/trust-source/anchors/homelab-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'Archlinux'
  notify: Update CA trust (Arch)

---
- name: Restart ros-lidar
  become: true
  become_user: "{{ ros_lidar_user }}"
  ansible.builtin.systemd_service:
    name: ros-lidar
    scope: user
    state: restarted
    daemon_reload: true
  vars:
    ros_lidar_uid: "{{ ansible_facts.getent_passwd[ros_lidar_user][1] }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ros_lidar_uid }}"
  when: not ansible_check_mode

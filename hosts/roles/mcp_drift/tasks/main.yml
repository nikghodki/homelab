---
- name: MCP drift check
  when: mcp_drift_enabled | bool
  block:
    - name: Accounts to manage
      ansible.builtin.set_fact:
        mcp_drift_accounts: "{{ mcp_drift_users if mcp_drift_users | length > 0 else [ansible_facts['user_id']] }}"

    - name: Account home folders
      ansible.builtin.getent:
        database: passwd

    - name: Drift job for each account
      ansible.builtin.include_tasks: account.yml
      loop: "{{ mcp_drift_accounts }}"
      loop_control:
        loop_var: mcp_drift_account

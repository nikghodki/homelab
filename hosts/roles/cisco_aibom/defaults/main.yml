# Cisco AIBOM (cisco-ai-defense/aibom) fleet inventory: a nightly scan of the agent code and AI container images
# that actually run on the host. See runbooks/aibom.md.
cisco_aibom_enabled: false
cisco_aibom_dirs: []         # [{name: hermes-agent, path: /home/...}] scanned in place, read-only
cisco_aibom_containers: []   # running container names; the image each one runs is scanned
# false = no image scans on this host at all (the role refuses `cisco_aibom_containers`); its images can be scanned
# from another host by digest instead (cisco_aibom_remote_images there). The Jetson: runbooks/aibom.md.
cisco_aibom_image_scans: true
# Other hosts' images, pulled here by digest and scanned here; reported as that host's (`host`, `scanned_on`).
# [{host: jetson, name: homeassistant, image: "repo:tag@sha256:...", paths: [/usr/src/homeassistant]}]
# `paths`: extra dirs for the docker-cp fallback (containerd image store; the working dir, /app, /opt, /srv always).
cisco_aibom_remote_images: []
# Other hosts' code dirs, copied here and scanned here; reported as that host's (`host`, `scanned_on`), under the
# same memory guard as image targets (threshold keyed by `name`). [{host: jetson, name: hermes-agent}]: `name` is a
# module that host serves (cisco_aibom_mirror_modules there). Each run refreshes the copy first: rsync over SSH
# (this host's own key, the other host's pinned host key) from a read-only rsync daemon, into
# <state>/mirror/<host>/<name>. Regular files only; the exclusions below are applied by both ends.
cisco_aibom_remote_dirs: []
cisco_aibom_mirror_key: /etc/cisco-aibom/mirror_ed25519
cisco_aibom_mirror_timeout_s: 1800
# Serving side: code dirs other hosts may copy, read-only, each read as its owner. [{name, path, owner, excludes}]
# (`excludes`: extra rsync patterns for this dir). The SSH key of each host that lists one of them in
# cisco_aibom_remote_dirs is installed for `cisco_aibom_mirror_user`, with a forced command (the daemon) only.
cisco_aibom_mirror_modules: []
cisco_aibom_mirror_user: aibom-mirror
# Never copied (rsync patterns, any depth unless anchored with "/"). File patterns (no "/") are also checked on the
# copy: a hit deletes it and fails the target. Lockfiles and manifests stay; AIBOM skips venvs and node_modules
# itself, so leaving them out changes no result.
cisco_aibom_mirror_excludes:
  # secrets and credentials (by name; values are never looked at)
  - .env
  - .env.*
  - "*.env"
  - .envrc
  - "*.key"
  - "*.pem"
  - "*.p12"
  - "*.pfx"
  - "*.jks"
  - "*.keystore"
  - "id_rsa*"
  - "id_ecdsa*"
  - "id_ed25519*"
  - .netrc
  - .npmrc
  - .pypirc
  - .git-credentials
  - auth.json
  - credentials.json
  - token.json
  - "*.token"
  - "secrets.y*ml"
  - secrets.json
  - secrets.toml
  # runtime state and logs
  - "*.db"
  - "*.db-*"
  - "*.sqlite"
  - "*.sqlite3"
  - "*.log"
  # environments and caches
  - venv/
  - .venv/
  - node_modules/
  - __pycache__/
  - "*.pyc"
  - "*.egg-info/"
  # build output (AIBOM skips dist/ and build/ too; a bundle can inline build-time values)
  - dist/
  - build/
cisco_aibom_time: "*-*-* 04:20:00"
cisco_aibom_keep_days: 30
cisco_aibom_memory_max: 4G   # systemd MemoryMax of the unit (the Sparks: 6G, group_vars/sparks.yml)
# Pre-flight guard: an image target is skipped ("aibom.skipped", reason "skipped: low memory") when MemAvailable is
# below this many GiB when its turn comes. 0 = off. Per container overrides in the map.
cisco_aibom_image_min_mem_gib: 0
cisco_aibom_image_min_mem_gib_by_container: {}
cisco_aibom_timeout_s: 3600  # per target
cisco_aibom_unit_timeout: 6h  # whole run
cisco_aibom_prefix: /opt/cisco-aibom
cisco_aibom_state: /var/lib/cisco-aibom
cisco_aibom_requirements: "{{ playbook_dir }}/../../.github/requirements-aibom.txt"
# LLM for the agentic stage (confirms or drops candidates). Off while the key is empty: the job then points it at a
# closed port and runs deterministic-only. The key is LiteLLM's dedicated `cisco-aibom` key (qwen3.8-27b only, 10 rpm,
# 1 in flight), loaded from secrets/litellm.enc.yaml by playbooks/aibom.yml; it lands in a root-only env file.
cisco_aibom_llm_api_key: ""
cisco_aibom_llm_api_base: http://model.nghodki.ai/v1
cisco_aibom_llm_model: qwen3.8-27b   # decisions/0011-default-model.md
cisco_aibom_llm_rate_limit: 0.2      # requests/second, client side (LiteLLM's key limit is the hard cap)
cisco_aibom_llm_timeout_s: 900       # per agentic batch; the first request may start the on-demand model

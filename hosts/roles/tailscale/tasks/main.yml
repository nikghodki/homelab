- name: Tailscale is installed
  ansible.builtin.package:
    name: tailscale
    state: present
  register: tailscale_pkg

- name: Tailscale daemon is enabled and running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  # In check mode a package that would be installed is not really there yet, so its service cannot be checked.
  when:
    - tailscale_enabled | bool
    - not (ansible_check_mode and tailscale_pkg is changed)

- name: Read Tailscale state
  ansible.builtin.command: tailscale status --json --self --peers=false
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report hosts that are not logged in to Tailscale
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Tailscale
      {{ ((tailscale_status.stdout | from_json).BackendState | default('unknown'))
         if tailscale_status.rc == 0 else 'not installed or not running' }}

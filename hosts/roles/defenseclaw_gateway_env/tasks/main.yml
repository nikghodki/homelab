---
- name: Accounts to manage
  ansible.builtin.set_fact:
    defenseclaw_gateway_env_accounts: >-
      {{ defenseclaw_gateway_env_users if defenseclaw_gateway_env_users | length > 0 else [ansible_facts['user_id']] }}

- name: Account home folders
  ansible.builtin.getent:
    database: passwd

- name: Gateway PATH drop-in for each account
  ansible.builtin.include_tasks: account.yml
  loop: "{{ defenseclaw_gateway_env_accounts }}"
  loop_control:
    loop_var: defenseclaw_gateway_env_account

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom
    state: restarted
  when: not ansible_check_mode

- name: Restart gpu-oom-guard
  ansible.builtin.systemd_service:
    name: gpu-oom-guard
    state: restarted
  when: not ansible_check_mode

---
- name: Restart safety-governor
  become: true
  become_user: "{{ safety_governor_user }}"
  ansible.builtin.systemd_service:
    name: safety-governor
    scope: user
    state: restarted
    daemon_reload: true
  vars:
    safety_governor_uid: "{{ ansible_facts.getent_passwd[safety_governor_user][1] }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ safety_governor_uid }}"
  when: not ansible_check_mode

- name: Restart robot-motion-bridge
  become: true
  ansible.builtin.systemd_service:
    name: robot-motion-bridge
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

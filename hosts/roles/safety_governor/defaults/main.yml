---
# Robot safety governor on the Pi (plan P5.2; runbooks/robot-safety.md). A ROS 2 node in the
# RoboStack env ros2_kilted (role ros_lidar sets up Zenoh), plus a NATS client as user picoclaw.
safety_governor_user: nikghodki-raspberry-1
safety_governor_home: "/home/{{ safety_governor_user }}"
safety_governor_micromamba: "{{ safety_governor_home }}/.local/bin/micromamba"
safety_governor_env: "{{ safety_governor_home }}/.local/share/mamba/envs/ros2_kilted"
safety_governor_zenoh_env: "{{ safety_governor_home }}/.config/homelab-ros/zenoh.env"
safety_governor_code_dir: "{{ safety_governor_home }}/.local/lib/safety-governor"
safety_governor_config_dir: "{{ safety_governor_home }}/.config/safety-governor"
safety_governor_src: "{{ playbook_dir }}/../../robots/safety"
# nats-py in the env, pinned (conda-forge, noarch)
safety_governor_nats_py_version: 2.14.0

# Limits come from robots/safety/limits.yaml (one source); override single keys here if needed.
safety_governor_limits: "{{ lookup('ansible.builtin.file', safety_governor_src ~ '/limits.yaml') | from_yaml }}"
safety_governor_limit_overrides: {}

# Output side. Only "mock" is safe to leave running: the real sinks (http_velocity,
# ros_cmd_vel) are used only when safety_governor_real_sink_enabled is true, which is
# for the on-blocks test only (runbooks/robot-safety.md). Never enable it here by default.
safety_governor_sink: mock
safety_governor_real_sink_enabled: false
safety_governor_http_url: ""   # the car, e.g. http://192.168.86.x (roboclaw.local does not resolve)

safety_governor_nats_url: tls://nats.nghodki.ai:4222
# Clearing the e-stop is for humans only (runbooks/robot-safety.md): over NATS only the operator user may publish
# robot.pi.safety.reset (safety-reset reads its password from this root-only file). Reset over ROS
# (/safety/reset) is refused unless this is true: any node on the Zenoh network could publish it.
safety_governor_ros_reset_enabled: false
safety_governor_operator_credentials: /etc/safety-operator/nats-operator.json
safety_governor_nats_ca: /usr/local/share/ca-certificates/homelab-ca.crt
# Operator CLI on other hosts (tasks/operator_cli.yml, dgx-1)
safety_governor_cli_user: "{{ ansible_user }}"
safety_governor_cli_home: "/home/{{ safety_governor_cli_user }}"
safety_governor_cli_dir: "{{ safety_governor_cli_home }}/.local/share/safety-cli"
safety_governor_cli_nats:
  url: "{{ safety_governor_nats_url }}"
  ca_file: "{{ safety_governor_nats_ca }}"
  estop_subject: robot.pi.safety.estop
  reset_subject: robot.pi.safety.reset
  status_subject: robot.pi.safety.status
safety_governor_metrics_port: 9113   # 127.0.0.1 only; scraped by the host collector
safety_governor_control_rate_hz: 10
safety_governor_status_rate_hz: 2

# Motion bridge (runbooks/robot-safety.md): the only way picoclaw's MCP motion tools reach the robot. A
# system unit as the governor's user, socket in /run/robot-motion (group robot-motion: picoclaw), publishing
# /cmd_vel_in + /safety/heartbeat while a move runs. Speed 255 maps to full_speed_*, which must stay above
# the caps (the governor clamps) and below the ceiling (the governor would reject).
safety_governor_motion_group: robot-motion
safety_governor_motion_socket: /run/robot-motion/motion.sock
safety_governor_motion_bridge:
  full_speed_linear: 0.4
  full_speed_angular: 2.0
  turn_rate: 0.8
  default_duration_ms: 1000
  max_duration_ms: 10000
  estop_on_stop: true
# The motion integration test runs picoclaw's real MCP server (role picoclaw) as picoclaw against a test bridge.
safety_governor_mcp_user: picoclaw
safety_governor_mcp_node: /var/lib/picoclaw/bin/node
safety_governor_mcp_server: /var/lib/picoclaw/roboclaw/mcp-server/picoclaw-hardware-mcp.js

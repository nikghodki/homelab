# Wi-Fi regulatory domain (infra review 2026-11 §3.2 N7). The Pi booted with cfg80211.ieee80211_regdom=UM, which the
# regulatory database doesn't resolve, so it sat in WORLD (5 GHz channels passive-only) and wpa_supplicant logged
# CTRL-EVENT-REGDOM-CHANGE about 1,080 times an hour. The router and the Sparks are US (iw reg get: DFS-FCC).
wifi_regdom_country: US
wifi_regdom_cmdline: /boot/firmware/cmdline.txt
# The kernel parameter takes effect at the next boot. Setting it on the running system (iw reg set) can make the
# Broadcom firmware re-tune, a short Wi-Fi drop for the safety governor and picoclaw, so it's opt-in, with the robot
# docked: ansible-playbook playbooks/wifi.yml -e wifi_regdom_apply_now=true
wifi_regdom_apply_now: false

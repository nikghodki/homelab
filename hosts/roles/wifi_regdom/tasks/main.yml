- name: Is this a Raspberry Pi boot command line
  ansible.builtin.stat:
    path: "{{ wifi_regdom_cmdline }}"
  register: wifi_regdom_cmdline_file

- name: Current command line
  ansible.builtin.slurp:
    src: "{{ wifi_regdom_cmdline }}"
  register: wifi_regdom_cmdline_now
  when: wifi_regdom_cmdline_file.stat.exists

# Ansible's own backup names (with ":" and "@") aren't valid on the FAT boot partition: keep one plain copy instead.
- name: Copy of the original command line (once)
  ansible.builtin.copy:
    src: "{{ wifi_regdom_cmdline }}"
    dest: "{{ wifi_regdom_cmdline }}.pre-regdom"
    remote_src: true
    force: false
    mode: preserve
  when: wifi_regdom_cmdline_file.stat.exists

- name: Regulatory domain on the kernel command line (replace the existing value; one line, no newline added)
  ansible.builtin.replace:
    path: "{{ wifi_regdom_cmdline }}"
    regexp: '(^|\s)cfg80211\.ieee80211_regdom=\S*'
    replace: '\1cfg80211.ieee80211_regdom={{ wifi_regdom_country }}'
  when:
    - wifi_regdom_cmdline_file.stat.exists
    - "'cfg80211.ieee80211_regdom=' in (wifi_regdom_cmdline_now.content | b64decode)"

- name: Regulatory domain on the kernel command line (add it)
  ansible.builtin.replace:
    path: "{{ wifi_regdom_cmdline }}"
    regexp: '^(.*\S)\s*$'
    replace: '\1 cfg80211.ieee80211_regdom={{ wifi_regdom_country }}'
  when:
    - wifi_regdom_cmdline_file.stat.exists
    - "'cfg80211.ieee80211_regdom=' not in (wifi_regdom_cmdline_now.content | b64decode)"

# Hosts without a Raspberry Pi command line (the Jetson boots through extlinux) load cfg80211 as a module, so its
# option takes effect at the next boot.
- name: Regulatory domain as a cfg80211 module option (hosts without a Pi command line)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cfg80211-regdom.conf
    content: |
      # Managed by homelab (role wifi_regdom). Takes effect when cfg80211 loads, i.e. at the next boot.
      options cfg80211 ieee80211_regdom={{ wifi_regdom_country }}
    owner: root
    group: root
    mode: "0644"
  when: not wifi_regdom_cmdline_file.stat.exists

- name: Regulatory domain now (opt-in, wifi_regdom_apply_now)
  ansible.builtin.command:
    cmd: /usr/sbin/iw reg set {{ wifi_regdom_country }}
  changed_when: true
  when: wifi_regdom_apply_now | bool

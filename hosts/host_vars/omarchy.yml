# Omarchy's package database is stale (the mirror 404s the Tailscale build it lists). Installing one package after
# refreshing the database would be a partial upgrade, which Arch does not support. Tailscale is handled with a full
# system update instead (plan P0.10); until then the baseline skips it here.
tailscale_install: false
# fleet-metrics is not installed here yet
otel_host_collector_scrape_fleet_metrics: false

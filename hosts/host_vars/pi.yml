restic_backup_paths:
  - /home/nikghodki-raspberry-1/.picoclaw
  - /home/nikghodki-raspberry-1/.defenseclaw
  - /home/nikghodki-raspberry-1/maps
  - /home/nikghodki-raspberry-1/workspace
  - /home/nikghodki-raspberry-1/ros2-test/oradar_ws/src
  - /home/nikghodki-raspberry-1/.config/systemd/user
  - /home/nikghodki-raspberry-1/.config/picoclaw
  - /home/nikghodki-raspberry-1/.config/defenseclaw-edge
restic_backup_excludes:
  - /home/nikghodki-raspberry-1/.picoclaw/logs
edge_connector_device_id: 1
edge_connector_ipc_user: nikghodki-raspberry-1
# Cisco AIBOM (runbooks/aibom.md)
cisco_aibom_enabled: true
cisco_aibom_memory_max: 1500M
cisco_aibom_dirs:
  - {name: picoclaw, path: /home/nikghodki-raspberry-1/.picoclaw}
  - {name: roboclaw, path: /home/nikghodki-raspberry-1/workspace/roboclaw}
# Safety governor metrics (127.0.0.1 only) for the status-stale alert (runbooks/robot-safety.md)
otel_host_collector_extra_scrapes:
  - {job: safety-governor, target: "127.0.0.1:9113", interval: 15s}
# Hardening (runbooks/hardening.md): the Pi never forwards, so it stops sending ICMP redirects too.
hardening_router: false
# Lynis exceptions (runbooks/hardening.md)
lynis_skip_tests:
  - id: PKGS-7388
    reason: >-
      False positive: trixie-security is in deb822 debian.sources (deb.debian.org/debian-security), which
      Lynis 3.1.4 does not parse; roles/hardening asserts a -security suite

restic_backup_paths:
  - /opt/homelab
  # Pocket ID's volume in k3s (local-path PV on dgx-2, runbooks/sign-in.md "Pocket ID in k3s"); the PVC's UID is in the
  # name. The database itself goes in as a SQLite snapshot (below). Not backed up at all while it ran in Docker.
  - /var/lib/rancher/k3s/storage/pvc-7a351907-71e3-4534-97d8-300a06317ac5_console_pocket-id-data
restic_backup_excludes:
  - /var/lib/rancher/k3s/storage/pvc-7a351907-71e3-4534-97d8-300a06317ac5_console_pocket-id-data/pocket-id.db
restic_backup_sqlite:
  - {name: pocket-id, path: /var/lib/rancher/k3s/storage/pvc-7a351907-71e3-4534-97d8-300a06317ac5_console_pocket-id-data/pocket-id.db}
# Cisco AIBOM (runbooks/aibom.md)
cisco_aibom_enabled: true
cisco_aibom_containers: [observe-phoenix-1]
# The Jetson's images, by the digest it runs (one source: its compose stack), scanned here with this host's memory
# guard (group_vars/sparks.yml) and reported as host "jetson". ros-zenoh is built on the Jetson (no registry
# digest) and has no AI components; it isn't listed.
cisco_aibom_remote_images:
  - host: jetson
    name: homeassistant
    image: "{{ (lookup('file', inventory_dir ~ '/stacks/home-assistant/compose.yaml') | from_yaml).services.homeassistant.image }}"
    paths: [/usr/src/homeassistant]
# The Jetson's Hermes checkouts, copied here before each scan from its read-only rsync daemon (the commit and
# working tree it runs, without secrets, venvs or node_modules) and scanned here as host "jetson"
cisco_aibom_remote_dirs:
  - {host: jetson, name: hermes-agent}
  - {host: jetson, name: hermes-agent-hermes-nikhil}
# Home Assistant's core is ~10,900 Python files (over 30 min here): 3 h per target; the whole run (own container,
# two Hermes copies, Home Assistant) gets 10 h
cisco_aibom_timeout_s: 10800
cisco_aibom_unit_timeout: 10h
# k3s (plan P3.2): starts the cluster (dgx-2 is the less critical Spark)
k3s_node_ip: 10.100.136.2
k3s_node_external_ip: 192.168.86.36
k3s_cluster_init: true
# Found running, unused (checked 2026-11-16: enabled since the install, listening on *:5201, its journal shows no
# connection ever). Same as dgx-1's. roles/retired_units
retired_units_system:
  - {unit: iperf3.service, reason: "unused; run iperf3 -s by hand for a link test"}
# ops-ro `certs` (roles/ops_agent_access; k3s certs are added by group)
ops_agent_access_certs:
  - /opt/homelab/backup/rest-server/backup.crt
  - /opt/homelab/jobs/temporal/tls/ca.crt
  - /opt/homelab/jobs/temporal/tls/server.crt
  - /opt/homelab/jobs/temporal/tls/system-worker.crt
  - /opt/homelab/jobs/admin-tools/tls/admin-tools.crt
  - /opt/homelab/jobs/ui/tls/ui.crt
  - /usr/local/share/ca-certificates/homelab-ca.crt
  - /usr/local/share/ca-certificates/nghodki-web-ca.crt

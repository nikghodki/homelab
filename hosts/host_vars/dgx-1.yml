defenseclaw_fleet_enabled: true
# Weekly LLM rescan (the watch rescan, now a fixed Sunday 02:00 run) for the
# per-user install of the login user (nikghodki-dgx). The policy's watch is off
# everywhere, so this timer is the only recurring LLM rescan on the host.
defenseclaw_rescan_enabled: true
# DefenseClaw Fleet gateway metrics (admin bearer token from secrets/fleet.enc.yaml, loaded by playbooks/collectors.yml)
# and the LiteLLM usage exporter (who called the model API; playbooks/litellm-usage.yml, runbooks/litellm.md)
otel_host_collector_extra_scrapes: >-
  {{ sparks_extra_scrapes + [{'job': 'defenseclaw-fleet', 'target': '127.0.0.1:18970',
     'path': '/api/v1/fleet/metrics',
     'bearer_token_file': '/run/credentials/otelcol-contrib.service/fleet-api-token'},
     {'job': 'litellm-usage', 'target': '127.0.0.1:9112'}] }}
restic_backup_paths:
  - /home/nikghodki-dgx/edge-gateway/conf
  - /home/nikghodki-dgx/edge-gateway/dnsmasq
  - /home/nikghodki-dgx/voice-assistant/nginx
  - /opt/homelab/litellm
  - /home/nikghodki-dgx/.defenseclaw
  - /home/nikghodki-dgx/workspace/dgx-model-manager/data
  - /home/nikghodki-dgx/workspace/dgx-model-manager/config.yaml
  - /home/nikghodki-dgx/workspace/dgx-model-manager/secrets
  # Open WebUI's volume in k3s (local-path PV on dgx-1, runbooks/open-webui.md); the PVC's UID is in the name
  - /var/lib/rancher/k3s/storage/pvc-c23bf76c-16ed-4d59-9ce8-4188cc12cceb_open-webui_open-webui-data
  # k3s etcd snapshots (every 12 h, 5 kept; runbooks/k3s.md)
  - /var/lib/rancher/k3s/server/db/snapshots
restic_backup_excludes:
  - /home/nikghodki-dgx/workspace/dgx-model-manager/data/dgxmm.sqlite3
  - /home/nikghodki-dgx/workspace/dgx-model-manager/data/gguf
  - /home/nikghodki-dgx/workspace/dgx-model-manager/data/hf
  - /var/lib/rancher/k3s/storage/pvc-c23bf76c-16ed-4d59-9ce8-4188cc12cceb_open-webui_open-webui-data/webui.db
  - /var/lib/rancher/k3s/storage/pvc-c23bf76c-16ed-4d59-9ce8-4188cc12cceb_open-webui_open-webui-data/cache
restic_backup_sqlite:
  - {name: dgxmm, path: /home/nikghodki-dgx/workspace/dgx-model-manager/data/dgxmm.sqlite3}
  - {name: open-webui, path: /var/lib/rancher/k3s/storage/pvc-c23bf76c-16ed-4d59-9ce8-4188cc12cceb_open-webui_open-webui-data/webui.db}
restic_backup_pre_commands:
  # LiteLLM's database in k3s (CNPG data/litellm-db, runbooks/litellm.md "In k3s"): a dump from the primary. The stopped
  # Docker copy's data stays in its volume (and /opt/homelab/litellm) until 2026-11-23.
  - >-
    P=$(k3s kubectl -n data get pod -l cnpg.io/cluster=litellm-db,cnpg.io/instanceRole=primary -o name)
    && k3s kubectl -n data exec $P -c postgres -- pg_dump -U postgres -d litellm --no-owner | gzip > /var/backups/homelab/litellm-db.sql.gz
# Cisco AIBOM (runbooks/aibom.md). DGXMM and LiteLLM are only read. Memory cap and guard: group_vars/sparks.yml.
cisco_aibom_enabled: true
cisco_aibom_dirs:
  - {name: dgx-model-manager, path: /home/nikghodki-dgx/workspace/dgx-model-manager}
  - {name: litellm, path: /opt/homelab/litellm}
cisco_aibom_containers: [litellm-proxy, open-webui]
# The agentic stage's model API: the role's default, http://model.nghodki.ai/v1 (the front door), as on every host;
# LiteLLM is in k3s since 2026-11-16 and no longer on dgx-1's loopback.
# The host collector pushes to dgx-2 over the direct QSFP cable (10.100.136.2, 0.3 ms) instead of Wi-Fi (22 ms avg,
# 149 ms max; infra review 2026-11 §6.2). otel-fleet publishes 4319 on all of dgx-2's interfaces.
otel_host_collector_endpoint: "10.100.136.2:4319"
# k3s (plan P3.2)
k3s_node_ip: 10.100.136.1
k3s_node_external_ip: 192.168.86.44
k3s_kubeconfig_user: nikghodki-dgx
# The LAN IP, not k8s.nghodki.ai: edge-dnsmasq answers AAAA with NXDOMAIN, which Go's resolver (kubectl) treats as no such host
k3s_kubeconfig_server: https://192.168.86.44:6443
# Found running, unused (checked 2026-11-15: /etc/exports empty, no NFS clients or mounts on any host, iperf3 never
# accepted a connection). nfs-kernel-server came with the Jetson reflash tools (2026-11-12; re-enable nfs-server and
# rpcbind for the next reflash), iperf3 with a one-off link test (2026-11-14). roles/retired_units
retired_units_system:
  - {unit: nfs-server.service, reason: "no exports, no clients; only for a Jetson reflash"}
  - {unit: nfs-blkmap.service, reason: "pNFS client helper; no NFS mounts"}
  - {unit: fsidd.service, reason: "NFS server helper"}
  - {unit: rpcbind.socket, reason: "NFS only"}
  - {unit: rpcbind.service, reason: "NFS only"}
  - {unit: iperf3.service, reason: "one-off link test; run iperf3 -s by hand when needed"}
# ops-ro `certs` and `defenseclaw` (roles/ops_agent_access; k3s certs are added by group)
ops_agent_access_certs:
  - /opt/homelab/bus/nats/certs/nats.crt
  - /opt/homelab/fleet/caddy/certs/fleet.crt
  - /opt/homelab/fleet/mosquitto/certs/fleet.crt
  - /usr/local/share/ca-certificates/homelab-ca.crt
  - /usr/local/share/ca-certificates/nghodki-web-ca.crt
ops_agent_access_defenseclaw_ports: [18970]

# Two per-user DefenseClaw installs: the main Hermes profile and nikhil-ghodki's own user (P0.15).
defenseclaw_policy_users: [nikjetson, hermes-nikhil]
# MCP admission and nightly drift check (plan P4.3, runbooks/mcp-admission.md); servers in policies/defenseclaw/mcp-servers.yaml
defenseclaw_policy_mcp_admission: true
mcp_drift_enabled: true
# Hermes is connected to DefenseClaw here, so the AIBOM has content
defenseclaw_aibom_enabled: true
restic_backup_paths:
  - /home/nikjetson/.hermes
  - /home/nikjetson/hermes-homes
  - /home/nikjetson/homeassistant/config
  - /home/nikjetson/.defenseclaw
  - /home/nikjetson/.config/livekit
  - /home/nikjetson/.config/systemd/user
  - /home/nikjetson/workspace/roboclaw
restic_backup_excludes:
  - /home/nikjetson/.hermes/hermes-agent
  - /home/nikjetson/.hermes/tools
  - /home/nikjetson/.hermes/cache
  - /home/nikjetson/.hermes/installs
  - /home/nikjetson/.hermes/audio_cache
  - /home/nikjetson/.hermes/image_cache
  - /home/nikjetson/.hermes/logs
  - /home/nikjetson/.defenseclaw/inventory.db*
  - /home/nikjetson/homeassistant/config/home-assistant_v2.db*
restic_backup_sqlite:
  - {name: home-assistant, path: /home/nikjetson/homeassistant/config/home-assistant_v2.db}
# Cisco AIBOM (runbooks/aibom.md); DefenseClaw's own AIBOM above keeps running next to it
cisco_aibom_enabled: true
cisco_aibom_memory_max: 3G
# Each Hermes checkout is ~8,000 Python files: over an hour per install on the Orin, so start early
cisco_aibom_time: "*-*-* 01:30:00"
cisco_aibom_timeout_s: 10800
cisco_aibom_unit_timeout: 10h
cisco_aibom_dirs:
  - {name: hermes-agent, path: /home/nikjetson/.hermes/hermes-agent}
  - {name: hermes-agent-hermes-nikhil, path: /home/hermes-nikhil/.hermes/hermes-agent}
  - {name: roboclaw, path: /home/nikjetson/workspace/roboclaw}
# k3s (plan P3.2, design D2): etcd member + tainted worker. Memory is tight (Hermes x2, Home Assistant, LiveKit, ...).
k3s_role: server
k3s_etcd_only: true
k3s_node_ip: 192.168.86.211
k3s_flannel_iface: wlP1p1s0
k3s_lan_iface: wlP1p1s0
k3s_link_routes:
  - {dest: 10.100.136.1/32, via: 192.168.86.44}
  - {dest: 10.100.136.2/32, via: 192.168.86.36}
k3s_node_labels: [nghodki.ai/role=edge-robot, nghodki.ai/hw=orin]
k3s_node_taints: ["nghodki.ai/jetson=true:NoSchedule"]
k3s_min_mem_available_mb: 2048
# About 2.3 GiB allocatable; pods are evicted before host processes run out of memory.
k3s_kubelet_args:
  - system-reserved=cpu=1500m,memory=4Gi
  - kube-reserved=cpu=500m,memory=768Mi
  - eviction-hard=memory.available<300Mi,nodefs.available<5%,imagefs.available<5%
  - max-pods=40

# ROS 2 + rmw_zenoh for the robot (plan P5.1): Zenoh router on the Jetson, LiDAR driver on the Pi;
# safety governor on the Pi (plan P5.2, runbooks/robot-safety.md; mock sink unless told otherwise).
# Always --check --diff first. The Pi's RoboStack env is a one-time manual step (runbooks/robot-ros.md).
- name: Zenoh router
  hosts: jetson_group
  become: true
  roles:
    - role: ros_zenoh_router

- name: LiDAR driver
  hosts: edge
  become: true
  roles:
    - role: ros_lidar

- name: Safety governor
  hosts: edge
  become: true
  roles:
    - role: safety_governor

# picoclaw as its own unprivileged user; its motion tools go through the governor's motion bridge
# (runbooks/robot-safety.md). After the governor play: that creates the robot-motion group and the bridge.
- name: PicoClaw (own user)
  hosts: edge
  become: true
  roles:
    - role: picoclaw

# Hermes' copy of the same MCP server on the Jetson (picoclaw_only, hermes-nikhil): its motion tools ask PicoClaw
# over MQTT/NATS instead of calling the car, so every move goes through the governor (runbooks/robot-safety.md).
- name: Hermes robot MCP (motion via PicoClaw)
  hosts: jetson_group
  roles:
    - role: hermes_robot_mcp

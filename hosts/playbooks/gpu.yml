# GPU plumbing (plan P1.6, P0.12 follow-up). Always --check --diff first.
- name: GPU metrics on the Sparks
  hosts: sparks
  become: true
  roles:
    - role: compose_stack
      vars:
        compose_stack_name: gpu
        compose_stack_src: "{{ playbook_dir }}/../stacks/gpu"

- name: CDI specs on the Jetson
  hosts: jetson_group
  become: true
  roles:
    - role: jetson_cdi

# Unified-memory OOM protection (runbooks/memory-guard.md). Both Sparks froze
# solid on 2026-11-15 when a benchmark used up memory with no OOM killer acting.
- name: Memory guard on the Sparks
  hosts: sparks
  become: true
  roles:
    - role: memory_guard

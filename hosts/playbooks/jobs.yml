# Jobs stack on dgx-2: Temporal + PostgreSQL + Web UI (plan P4.7, interim before k3s). Always --check --diff first.
# runbooks/temporal.md
- name: Jobs
  hosts: observe
  become: true
  pre_tasks:
    - name: Load jobs secrets from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/jobs.enc.yaml"
        name: jobs_secrets
      no_log: true
    - name: Load the Temporal certificate keys from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/pki.enc.yaml"
        name: pki_secrets
      no_log: true
    - name: Load sign-in client secrets from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/console.enc.yaml"
        name: console_secrets
      no_log: true
  vars:
    jobs_dir: /opt/homelab/jobs
    jobs_pki: "{{ playbook_dir }}/../files/pki/temporal"
    # Namespaces created if missing (retention, description). ops-agent: decision 0013 (the ops agent's workflows).
    jobs_namespaces:
      - {name: homelab, retention: 7d, description: "Homelab jobs (runbooks/temporal.md)"}
      - {name: ops-agent, retention: 30d, description: "Ops agent incidents and maintenance (decision 0013)"}
  roles:
    - role: compose_stack
      vars:
        compose_stack_name: jobs
        compose_stack_src: "{{ playbook_dir }}/../stacks/jobs"
        compose_stack_env:
          POSTGRES_PASSWORD: "{{ jobs_secrets.postgres_password }}"
          OIDC_TEMPORAL_SECRET: "{{ console_secrets.oidc_temporal_secret }}"
        # Certificate keys (*.key.j2) render 0600 for the containers' user (uid 1000 in all three images).
        compose_stack_private_templates: {temporal: 1000, ui: 1000, admin-tools: 1000}
        compose_stack_extra_files:
          - {src: "{{ jobs_pki }}/ca.crt", dest: temporal/tls/ca.crt}
          - {src: "{{ jobs_pki }}/server.crt", dest: temporal/tls/server.crt}
          - {src: "{{ jobs_pki }}/system-worker.crt", dest: temporal/tls/system-worker.crt}
          - {src: "{{ jobs_pki }}/ca.crt", dest: ui/tls/ca.crt}
          - {src: "{{ jobs_pki }}/ui.crt", dest: ui/tls/ui.crt}
          - {src: "{{ jobs_pki }}/ca.crt", dest: admin-tools/tls/ca.crt}
          - {src: "{{ jobs_pki }}/admin-tools.crt", dest: admin-tools/tls/admin-tools.crt}
  tasks:
    - name: Temporal frontend is serving
      ansible.builtin.command:
        cmd: docker compose exec -T admin-tools temporal operator cluster health
        chdir: "{{ jobs_dir }}"
      register: jobs_health
      until: jobs_health.rc == 0 and 'SERVING' in jobs_health.stdout
      retries: 30
      delay: 5
      changed_when: false
      when: not ansible_check_mode

    - name: Look up the namespaces
      ansible.builtin.command:
        cmd: docker compose exec -T admin-tools temporal operator namespace describe --namespace {{ item.name }}
        chdir: "{{ jobs_dir }}"
      loop: "{{ jobs_namespaces }}"
      loop_control: {label: "{{ item.name }}"}
      register: jobs_ns
      failed_when: jobs_ns.rc != 0 and 'not found' not in (jobs_ns.stderr | lower)
      changed_when: false
      when: not ansible_check_mode

    - name: Create the namespaces that are missing
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T admin-tools temporal operator namespace create
          --namespace {{ item.item.name }} --retention {{ item.item.retention }}
          --description "{{ item.item.description }}"
        chdir: "{{ jobs_dir }}"
      loop: "{{ jobs_ns.results | default([]) }}"
      loop_control: {label: "{{ item.item.name }}"}
      changed_when: true
      when:
        - not ansible_check_mode
        - item.rc != 0

# DefenseClaw extras (plan P1.11). DefenseClaw itself is installed per user with its release installer.
- name: DefenseClaw fleet policy
  hosts: all
  roles:
    - role: defenseclaw_policy

- name: DefenseClaw gateway PATH (scanners in ~/.local/bin, else fail closed)
  hosts: all
  roles:
    - role: defenseclaw_gateway_env

- name: DefenseClaw Fleet gateway (plan P1.12)
  hosts: all
  roles:
    - role: defenseclaw_fleet

- name: DefenseClaw nightly AIBOM
  hosts: all
  roles:
    - role: defenseclaw_aibom

- name: Nightly MCP drift check (plan P4.3)
  hosts: all
  roles:
    - role: mcp_drift

- name: Weekly DefenseClaw LLM rescan (the watch rescan, now a fixed Sunday 02:00 run)
  hosts: all
  roles:
    - role: defenseclaw_rescan

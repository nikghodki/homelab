# Ops launcher on the Dell: Homepage behind oauth2-proxy at ops.nghodki.ai (plan P1.15, runbooks/sign-in.md).
# Always --check --diff first. Docker at boot is set by playbooks/alerting.yml.
- name: Ops launcher
  hosts: alerting
  become: true
  pre_tasks:
    - name: Load console secrets from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/console.enc.yaml"
        name: console_secrets
      no_log: true
  vars:
    oidc_ops_secret: "{{ console_secrets.oidc_ops_secret }}"
    oauth2_proxy_ops_cookie_secret: "{{ console_secrets.oauth2_proxy_ops_cookie_secret }}"
  roles:
    - role: compose_stack
      vars:
        compose_stack_name: ops
        compose_stack_src: "{{ playbook_dir }}/../stacks/ops"
        compose_stack_private_templates:
          oauth2-proxy: 65532   # distroless nonroot

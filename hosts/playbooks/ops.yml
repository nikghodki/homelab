# Ops launcher on the Dell: Homepage behind oauth2-proxy at ops.nghodki.ai (plan P1.15, runbooks/sign-in.md), and the
# private docs site at docs.nghodki.ai (role docs_site builds it, the stack serves it, the front door signs people in;
# runbooks/docs-site.md).
# Always --check --diff first. Docker at boot is set by playbooks/alerting.yml.
- name: Ops launcher and docs site
  hosts: alerting
  become: true
  pre_tasks:
    - name: Load console secrets from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/console.enc.yaml"
        name: console_secrets
      no_log: true
    - name: Load docs secrets from SOPS
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/docs.enc.yaml"
        name: docs_secrets
      no_log: true
  vars:
    oidc_ops_secret: "{{ console_secrets.oidc_ops_secret }}"
    oauth2_proxy_ops_cookie_secret: "{{ console_secrets.oauth2_proxy_ops_cookie_secret }}"
    # The front door's token (decision 0011): the docs Caddy answers only requests that carry it
    edge_origin_token: "{{ console_secrets.edge_origin_token }}"
  roles:
    # First, so /srv/docs exists before the stack's `docs` container mounts it
    - role: docs_site
      vars:
        docs_site_deploy_key: "{{ docs_secrets.docs_deploy_key }}"
        docs_site_gatus_token: "{{ docs_secrets.docs_build_gatus_token }}"
    - role: compose_stack
      vars:
        compose_stack_name: ops
        compose_stack_src: "{{ playbook_dir }}/../stacks/ops"
        compose_stack_private_templates:
          oauth2-proxy: 65532        # distroless nonroot
          docs: 65534                # the docs Caddy (compose `user:`); its Caddyfile holds the edge origin token

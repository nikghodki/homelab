# From defenseclaw 1.0.9 loki.yaml; retention 30 days.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
  - from: 2024-01-01
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: index_
      period: 24h
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  otlp_config:
    resource_attributes:
      attributes_config:
      - action: index_label
        attributes:
        - deployment.environment.name
        - host.name
        - os.type
        - defenseclaw.sandbox.name
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: false
  max_query_length: 721h
  max_global_streams_per_user: 10000
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  max_line_size: 5MB
  max_line_size_truncate: false
  max_structured_metadata_size: 5MB
  max_structured_metadata_entries_count: 1024
  retention_period: 720h
ingester:
  chunk_idle_period: 2m
  chunk_retain_period: 30s
  max_chunk_age: 30m
# Ruler: recording rules only (the ops agent's log-error baselines, decision 0013 / design §4.3), remote-written to
# VictoriaMetrics; vmalert does the alerting. Rules: ./rules/fake/*.yml (tenant "fake" without auth).
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: false
  evaluation_interval: 1m
  rule_path: /loki/rules-temp
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      victoriametrics:
        url: http://victoriametrics:8428/api/v1/write
analytics:
  reporting_enabled: false

# DefenseClaw data source UIDs kept so its dashboards work unchanged.
apiVersion: 1
datasources:
- name: Prometheus (VictoriaMetrics)
  type: prometheus
  access: proxy
  uid: defenseclaw-prometheus
  url: http://victoriametrics:8428
  isDefault: true
  jsonData:
    httpMethod: POST
    timeInterval: 60s
    exemplarTraceIdDestinations:
    - name: trace_id
      datasourceUid: defenseclaw-tempo
- name: Loki
  type: loki
  access: proxy
  uid: defenseclaw-loki
  url: http://loki:3100
  jsonData:
    derivedFields:
    - datasourceUid: defenseclaw-tempo
      matcherRegex: (?:"trace_id"\s*:\s*"|trace_id=)([a-f0-9]{32})
      name: trace_id
      url: $${__value.raw}
- name: Alertmanager
  type: alertmanager
  access: proxy
  uid: defenseclaw-prometheus-alerts
  url: http://alertmanager:9093
  jsonData:
    implementation: prometheus
    handleGrafanaManagedAlerts: false
- name: Tempo
  type: tempo
  access: proxy
  uid: defenseclaw-tempo
  url: http://tempo:3200
  jsonData:
    tracesToLogsV2:
      datasourceUid: defenseclaw-loki
      spanStartTimeShift: -5m
      spanEndTimeShift: 5m
      filterByTraceID: true
      filterBySpanID: false
    tracesToMetrics:
      datasourceUid: defenseclaw-prometheus
    serviceMap:
      datasourceUid: defenseclaw-prometheus
    nodeGraph:
      enabled: true
    search:
      hide: false
    lokiSearch:
      datasourceUid: defenseclaw-loki

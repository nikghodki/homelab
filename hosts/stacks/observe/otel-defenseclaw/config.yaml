# DefenseClaw collector config from defenseclaw 1.0.9 (bundles/local_observability_stack),
# outputs pointed at this stack; debug exporter removed.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s
  deltatocumulative:
    max_stale: 24h
  filter/agent360-canary:
    error_mode: ignore
    trace_conditions:
    - span.attributes["defenseclaw.telemetry.canary"] == true
  transform/sandbox-identity:
    error_mode: ignore
    log_statements:
    - context: log
      conditions:
      - IsString(log.body) and IsMatch(log.body.string, "defenseclaw[.]sandbox[.]name")
      statements:
      - set(log.cache["record"], ParseJSON(log.body.string))
      - set(log.attributes["defenseclaw.sandbox.name"], log.cache["record"]["body"]["defenseclaw.sandbox.name"])
        where IsString(log.cache["record"]["body"]["defenseclaw.sandbox.name"])
  groupbyattrs/sandbox-identity:
    keys:
    - defenseclaw.sandbox.name
  filter/managed-sandbox-out:
    error_mode: ignore
    metric_conditions:
    - IsMatch(metric.name, "^defenseclaw[.]sandbox[.]managed[.]")
  filter/managed-sandbox-only:
    error_mode: ignore
    metric_conditions:
    - not IsMatch(metric.name, "^defenseclaw[.]sandbox[.]managed[.]")
  transform/managed-sandbox-resource:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version",
        "service.instance.id", "deployment.environment.name", "os.type"])
  resource:
    attributes:
    - key: service.namespace
      value: defenseclaw
      action: insert
    - key: deployment.environment.name
      value: homelab
      action: insert
connectors:
  forward/agent360: null
  spanmetrics/agent360:
    namespace: defenseclaw.agent.span
    histogram:
      explicit:
        buckets:
        - 5ms
        - 10ms
        - 25ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2s
        - 5s
        - 10s
        - 30s
        - 1m
        - 5m
    dimensions:
    - name: gen_ai.operation.name
    - name: gen_ai.agent.type
    - name: defenseclaw.agent.lifecycle.event
    - name: defenseclaw.agent.lifecycle.state
    - name: defenseclaw.agent.phase
    - name: defenseclaw.agent.phase.previous
    - name: defenseclaw.agent.phase.code
    - name: connector
    - name: gen_ai.tool.name
    - name: defenseclaw.destination.app
    - name: gen_ai.provider.name
    - name: gen_ai.request.model
    exemplars:
      enabled: true
    dimensions_cache_size: 10000
    resource_metrics_cache_size: 1000
    metrics_flush_interval: 15s
    metrics_expiration: 24h
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite/prometheus:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
      queue_size: 10000
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
service:
  extensions:
  - health_check
  - zpages
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
              without_type_suffix: true
              without_units: true
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - resource
      - batch
      exporters:
      - otlp/tempo
      - forward/agent360
    traces/agent360-spanmetrics:
      receivers:
      - forward/agent360
      processors:
      - filter/agent360-canary
      exporters:
      - spanmetrics/agent360
    metrics:
      receivers:
      - otlp
      - spanmetrics/agent360
      processors:
      - resource
      - filter/managed-sandbox-out
      - deltatocumulative
      - batch
      exporters:
      - prometheusremotewrite/prometheus
    metrics/managed-sandbox:
      receivers:
      - otlp
      processors:
      - resource
      - filter/managed-sandbox-only
      - transform/managed-sandbox-resource
      - deltatocumulative
      - batch
      exporters:
      - prometheusremotewrite/prometheus
    logs:
      receivers:
      - otlp
      processors:
      - resource
      - transform/sandbox-identity
      - groupbyattrs/sandbox-identity
      - batch
      exporters:
      - otlphttp/loki

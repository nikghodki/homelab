# The stack's own components. Hosts push through the collectors instead of being scraped.
global: {scrape_interval: 30s}
scrape_configs:
  - job_name: victoriametrics
    static_configs: [{targets: ["localhost:8428"]}]
  - job_name: vmalert
    static_configs: [{targets: ["vmalert:8880"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-defenseclaw:8888"]
        labels: {service: otel-collector, collector: defenseclaw}
      - targets: ["otel-fleet:8888"]
        labels: {service: otel-collector, collector: fleet}
  - job_name: loki
    static_configs: [{targets: ["loki:3100"], labels: {service: loki}}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"], labels: {service: tempo}}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: gatus
    static_configs: [{targets: ["gatus:8080"]}]

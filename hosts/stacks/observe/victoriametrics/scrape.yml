# The stack's own components. Hosts push through the collectors instead of being scraped.
global: {scrape_interval: 30s}
scrape_configs:
  - job_name: victoriametrics
    static_configs: [{targets: ["localhost:8428"]}]
  - job_name: vmalert
    static_configs: [{targets: ["vmalert:8880"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-defenseclaw:8888"]
        labels: {service: otel-collector, collector: defenseclaw}
      - targets: ["otel-fleet:8888"]
        labels: {service: otel-collector, collector: fleet}
  - job_name: loki
    static_configs: [{targets: ["loki:3100"], labels: {service: loki}}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"], labels: {service: tempo}}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  # Gatus on the Dell (stacks/alerting); the k3s rules read its results.
  - job_name: gatus
    static_configs: [{targets: ["192.168.86.49:8081"]}]
  # Temporal server in the jobs stack (plan P4.7); its metrics port is published on dgx-2's LAN address.
  - job_name: temporal
    static_configs: [{targets: ["192.168.86.36:9233"], labels: {service: temporal}}]
  # The ops agent (decision 0013): ingest and worker metrics on fixed ClusterIPs (cluster/README.md).
  - job_name: ops-ingest
    static_configs: [{targets: ["10.43.0.141:9100"], labels: {service: ops-agent}}]
  - job_name: ops-worker
    static_configs: [{targets: ["10.43.0.142:9100"], labels: {service: ops-agent}}]
  # k3s platform (plan P3.4/P3.5, runbooks/argocd.md, runbooks/kyverno.md): fixed ClusterIPs that dgx-2's kube-proxy
  # routes for host traffic (cluster/README.md). Job names match the Argo CD dashboard.
  - job_name: argocd-application-controller-metrics
    static_configs: [{targets: ["10.43.0.101:8082"], labels: {service: argocd}}]
  - job_name: argocd-server-metrics
    static_configs: [{targets: ["10.43.0.100:8083"], labels: {service: argocd}}]
  - job_name: argocd-repo-server-metrics
    static_configs: [{targets: ["10.43.0.102:8084"], labels: {service: argocd}}]
  - job_name: kyverno-admission
    static_configs: [{targets: ["10.43.0.110:8000"], labels: {service: kyverno}}]
  - job_name: kyverno-reports
    static_configs: [{targets: ["10.43.0.111:8000"], labels: {service: kyverno}}]
  # kube-state-metrics (cluster/platform/kube-state-metrics): pod/deployment/daemonset readiness for
  # vmalert/rules/front-door.yml, at its fixed ClusterIP.
  - job_name: kube-state-metrics
    static_configs: [{targets: ["10.43.0.120:8080"], labels: {service: kube-state-metrics}}]

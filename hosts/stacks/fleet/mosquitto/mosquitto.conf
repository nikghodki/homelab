# Managed by homelab Ansible (stacks/fleet).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8884
protocol mqtt
certfile /mosquitto/config/certs/fleet.crt
keyfile /mosquitto/config/certs/fleet.key
tls_version tlsv1.2

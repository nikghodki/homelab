# Console stack on dgx-2 (plan P1.13). STOPPED since 2026-11-16: Pocket ID runs in k3s (cluster/apps/pocket-id); this is
# the rollback copy until 2026-11-23 (playbooks/console.yml refuses to run without -e pocketid_docker_rollback=true).
# pocket-id: passkey-only OIDC provider at https://id.nghodki.ai (dgx-1 Caddy terminates TLS, D25).
# The launcher at https://ops.nghodki.ai (Homepage, plan P1.15) moved to the Dell: stacks/ops.
name: console

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.3@sha256:189e03bb73bb86d7108fe81cbe2237c408cff2176b14cd7a39cc12a2ee8b2762
    restart: unless-stopped
    environment:
      APP_URL: https://id.nghodki.ai
      TRUST_PROXY: "true"
      ENCRYPTION_KEY_FILE: /run/pocket-id/encryption_key
      STATIC_API_KEY_FILE: /run/pocket-id/static_api_key
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      UI_CONFIG_DISABLED: "false"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./pocket-id:/run/pocket-id:ro
      - pocket-id-data:/app/data
    ports:
      - "192.168.86.36:1411:1411"   # LAN only: the front door (k3s Caddy) is the only client

volumes:
  pocket-id-data:

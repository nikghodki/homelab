# Ops launcher on the Dell (plan P1.15; moved from dgx-2's console stack, runbooks/alerting.md). Deployed by
# playbooks/ops.yml to /opt/homelab/ops. Homepage at https://ops.nghodki.ai: only oauth2-proxy is on the LAN; it signs
# people in through Pocket ID (client `ops`, admins only; id.nghodki.ai stays on dgx-2) and forwards to homepage on the
# stack network.
# Docs at https://docs.nghodki.ai (runbooks/docs-site.md): a static Caddy that serves /srv/docs/current, which the
# docs-build timer (role docs_site) swaps atomically. Signed in by the front door (edge-auth, decision 0011); the docs
# Caddy answers on the LAN only to requests that carry the front door's X-Edge-Origin token.
name: ops

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ops.nghodki.ai
      LOG_TARGETS: stdout
      PUID: "1000"
      PGID: "1000"
      # siteMonitor checks go through the front door over https; trust the homelab web CA from the host bundle
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/services.yaml:/app/config/services.yaml:ro
      - ./homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      - "grafana.nghodki.ai:192.168.86.44"
      - "status.nghodki.ai:192.168.86.44"
      - "phoenix.nghodki.ai:192.168.86.44"
      - "ntfy.nghodki.ai:192.168.86.44"
      - "webui.nghodki.ai:192.168.86.44"
      - "model.nghodki.ai:192.168.86.44"
      - "dgxmanager.nghodki.ai:192.168.86.44"
      - "ha.nghodki.ai:192.168.86.44"
      - "id.nghodki.ai:192.168.86.44"
      - "ca.nghodki.ai:192.168.86.44"
    # no ports: only oauth2-proxy reaches it, on the stack network
    expose: ["3000"]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # Sign-in through Pocket ID (P1.13): reach id.nghodki.ai at the front door and trust the
    # homelab web CA from the host's bundle (role homelab_ca).
    extra_hosts: ["id.nghodki.ai:192.168.86.44"]
    ports:
      - "192.168.86.49:4180:4180"   # LAN only: dgx-1's Caddy is the only client (ops.nghodki.ai)
    depends_on: [homepage]

  # The docs site (runbooks/docs-site.md). Static files only, read-only. :8080 for Homepage on the stack network;
  # :4181 on the LAN for the front door (X-Edge-Origin required). /srv/docs/current is a relative symlink to
  # releases/<tree>, swapped by the build.
  docs:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs: [/tmp]
    volumes:
      - ./docs/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docs:/srv/docs:ro
    expose: ["8080"]
    ports:
      - "192.168.86.49:4181:4181"   # LAN only: the front door (docs.nghodki.ai); refuses requests without its token

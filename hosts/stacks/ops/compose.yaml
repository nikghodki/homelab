# Ops launcher on the Dell (plan P1.15; moved from dgx-2's console stack, runbooks/alerting.md). Deployed by
# playbooks/ops.yml to /opt/homelab/ops. Homepage at https://ops.nghodki.ai: the front door signs people in (edge-auth,
# decision 0011, admins only); on the LAN only the `docs` Caddy's gate (:4180) is published, which forwards to homepage
# on the stack network when the request carries the front door's X-Edge-Origin token.
# Docs at https://docs.nghodki.ai (runbooks/docs-site.md): a static Caddy that serves /srv/docs/current, which the
# docs-build timer (role docs_site) swaps atomically. Signed in by the front door (edge-auth, decision 0011); the docs
# Caddy answers on the LAN only to requests that carry the front door's X-Edge-Origin token.
name: ops

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ops.nghodki.ai
      LOG_TARGETS: stdout
      PUID: "1000"
      PGID: "1000"
      # siteMonitor checks go through the front door over https (the edge VIP, below); trust the homelab web CA from
      # the host bundle
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/services.yaml:/app/config/services.yaml:ro
      - ./homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # The in-cluster front door's LAN VIP (decision 0007); the Dell is a k3s node, so its kube-proxy answers for it.
    extra_hosts:
      - "grafana.nghodki.ai:192.168.86.11"
      - "status.nghodki.ai:192.168.86.11"
      - "phoenix.nghodki.ai:192.168.86.11"
      - "ntfy.nghodki.ai:192.168.86.11"
      - "webui.nghodki.ai:192.168.86.11"
      - "model.nghodki.ai:192.168.86.11"
      - "dgxmanager.nghodki.ai:192.168.86.11"
      - "ha.nghodki.ai:192.168.86.11"
      - "id.nghodki.ai:192.168.86.11"
      - "ca.nghodki.ai:192.168.86.11"
    # no ports: only the `docs` Caddy's gate reaches it, on the stack network
    expose: ["3000"]

  # The docs site (runbooks/docs-site.md) and Homepage's gate. Static files only, read-only. :8080 for Homepage on the
  # stack network; :4181 (docs) and :4180 (Homepage) on the LAN for the front door (X-Edge-Origin required).
  # /srv/docs/current is a relative symlink to releases/<tree>, swapped by the build.
  docs:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs: [/tmp]
    volumes:
      - ./docs/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docs:/srv/docs:ro
    expose: ["8080"]
    ports:
      - "192.168.86.49:4181:4181"   # LAN only: the front door (docs.nghodki.ai); refuses requests without its token
      - "192.168.86.49:4180:4180"   # LAN only: the front door (ops.nghodki.ai) -> homepage:3000; the same

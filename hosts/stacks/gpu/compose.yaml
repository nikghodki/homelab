# GPU metrics on the Sparks (plan P1.6): NVIDIA dcgm-exporter, loopback only. The host OTel
# collector scrapes it (otel_host_collector_extra_scrapes) and pushes to dgx-2 with everything else.
# GB10: utilisation, temperature, power, SM clock, energy, enc/dec; memory is unified (host metrics).
name: gpu

services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.9.0@sha256:2490e1dfb5baaee6765ef2841813af7d978bb459a566c22c326a8fc27c64eea9
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    ports:
      - "127.0.0.1:9400:9400"

# GPU metrics on the Sparks (plan P1.6): NVIDIA dcgm-exporter, loopback only. The host OTel
# collector scrapes it (otel_host_collector_extra_scrapes) and pushes to dgx-2 with everything else.
# GB10: utilisation, temperature, power, SM clock, energy, enc/dec; memory is unified (host metrics).
name: gpu

services:
  dcgm-exporter:
    # 4.8.x: 4.9.0 renames the metrics and changes units (DCGM 4.7 names); vmalert rules and dashboards use the old
    # ones. Hold the major in Renovate until they move (runbooks/ci-scanners.md).
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.8.4@sha256:148b0c025e5f2850256816fa33754fbf4733b7a086697a95613fc0ba3db5b003
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    ports:
      - "127.0.0.1:9400:9400"

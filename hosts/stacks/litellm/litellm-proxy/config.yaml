# LiteLLM Proxy Configuration for DGX vLLM Models
# Slim config — DB for virtual keys only, no caching/tracing

model_list:
  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/nvidia/Qwen3.6-35B-A3B-NVFP4
      api_base: http://vllm-qwen:8000/v1
      api_key: no-key-required
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

  - model_name: whisper-large-v3-turbo
    litellm_params:
      model: openai/whisper-large-v3-turbo
      api_base: http://vllm-whisper:8000/v1
      api_key: no-key-required
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  telemetry: false
  stream_response: true
  max_parallel_requests: 100
  disable_spend_logs: true

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true
  callbacks: qwen_system_merge.proxy_handler_instance
  cache: false
  success_callback: []
  failure_callback: []

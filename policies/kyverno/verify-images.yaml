# ghcr.io/nikghodki/* images must be signed by build-sign.yml on main (cosign keyless). Enforce.
# runbooks/kyverno.md, runbooks/build-sign.md, decision 0008.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images
  annotations:
    policies.kyverno.io/title: Verify signatures of the fleet's own images
    policies.kyverno.io/description: >-
      Every ghcr.io/nikghodki/* image needs a cosign keyless signature from
      .github/workflows/build-sign.yml at refs/heads/main (issuer token.actions.githubusercontent.com). The tag is
      replaced by the verified digest. Other registries aren't matched (restrict-registries and require-image-digest).
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 20
  # Pods only: digests are written into Pods, never into the Deployments etc. that Argo CD owns (a mutated
  # Deployment would differ from Git and selfHeal would fight the webhook). Admission only; background re-checks
  # would hit the registry every hour.
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # pods/ephemeralcontainers: `kubectl debug` adds containers through this subresource (code review #10)
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: "ghcr.io/nikghodki/*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: buildsign
      cosign:
        keyless:
          identities:
            - subjectRegExp: '^https://github\.com/nikghodki/homelab/\.github/workflows/build-sign\.yml@refs/heads/main$'
              issuer: https://token.actions.githubusercontent.com
  variables:
    # verifyImageSignatures returns 0 for an image outside matchImageReferences, so check only ours.
    - name: ours
      expression: >-
        (images.containers
          + ('initContainers' in images ? images.initContainers : [])
          + ('ephemeralContainers' in images ? images.ephemeralContainers : []))
        .filter(i, i.startsWith('ghcr.io/nikghodki/'))
  validations:
    - expression: >-
        variables.ours.all(i, verifyImageSignatures(i, [attestors.buildsign]) > 0)
      messageExpression: >-
        'ghcr.io/nikghodki images must be signed by build-sign.yml on main (runbooks/build-sign.md): '
        + variables.ours.join(', ')

# No privileged containers and no host network/PID/IPC, except in the allowlisted namespaces below. Enforce
# (runbooks/kyverno.md). kube-vip (P3.3: hostNetwork, NET_ADMIN/NET_RAW) runs in kube-system, so it is covered here.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged and host-namespace pods
    policies.kyverno.io/description: >-
      No privileged containers, hostNetwork, hostPID or hostIPC outside the allowlist (kube-system, kyverno,
      cnpg-system). Later: the Fleet API proxy (hostNetwork, security) and Tetragon (P3.6) get added here.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background: {enabled: true}
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, cnpg-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # pods/ephemeralcontainers: `kubectl debug` adds containers through this subresource (code review #10)
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork)
        && !(has(object.spec.hostPID) && object.spec.hostPID)
        && !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: hostNetwork, hostPID and hostIPC are not allowed outside the allowlisted namespaces (runbooks/kyverno.md)
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
          || !c.securityContext.privileged)
      messageExpression: >-
        'privileged containers: ' + variables.containers.filter(c, has(c.securityContext)
          && has(c.securityContext.privileged) && c.securityContext.privileged).map(c, c.name).join(', ')

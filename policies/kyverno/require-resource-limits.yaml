# Every container (and init container) sets cpu and memory requests and limits. Enforce (runbooks/kyverno.md).
# kube-system is exempt: k3s's coredns and local-path-provisioner come from k3s's own manifests (no HelmChart to
# configure; edits are overwritten on restart) and the webhooks skip kube-system anyway.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require requests and limits
    policies.kyverno.io/description: Containers must set cpu and memory requests and limits (design, "limits required").
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background: {enabled: true}
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: missing
      expression: >-
        variables.containers.filter(c, !has(c.resources)
          || !has(c.resources.requests) || !('cpu' in c.resources.requests) || !('memory' in c.resources.requests)
          || !has(c.resources.limits) || !('cpu' in c.resources.limits) || !('memory' in c.resources.limits)
        ).map(c, c.name)
  validations:
    - expression: size(variables.missing) == 0
      messageExpression: >-
        'containers without cpu/memory requests and limits: ' + variables.missing.join(', ')

# DefenseClaw policy for every fleet host. Deployed by hosts/playbooks/defenseclaw.yml
# (role defenseclaw_policy) and activated with `defenseclaw policy activate homelab`.
# Based on the built-in default preset; MCP CRITICAL/HIGH findings block install and runtime
# because all MCP tools reach agents through the LiteLLM gateway (D18).
name: homelab
description: Homelab fleet policy (managed in nikghodki/homelab)
admission:
  scan_on_install: true
  allow_list_bypass_scan: true
skill_actions:
  critical:
    file: quarantine
    runtime: disable
    install: block
  high:
    file: quarantine
    runtime: disable
    install: block
  medium:
    file: none
    runtime: enable
    install: none
  low:
    file: none
    runtime: enable
    install: none
  info:
    file: none
    runtime: enable
    install: none
scanner_overrides:
  mcp:
    CRITICAL:
      runtime: block
      file: quarantine
      install: block
    HIGH:
      runtime: block
      file: none
      install: block
    MEDIUM:
      runtime: allow
      file: none
      install: none
    LOW:
      runtime: allow
      file: none
      install: none
  plugin:
    HIGH:
      runtime: block
      file: quarantine
      install: block
    MEDIUM:
      runtime: allow
      file: none
      install: none
first_party_allow_list:
- target_type: plugin
  target_name: defenseclaw
  reason: first-party DefenseClaw plugin
  source_path_contains:
  - .openclaw/extensions/defenseclaw
  - .zeptoclaw/extensions/defenseclaw
  - .claude/extensions/defenseclaw
  - .codex/extensions/defenseclaw
  - .config/amp/plugins/defenseclaw.ts
- target_type: skill
  target_name: codeguard
  reason: first-party DefenseClaw skill
  source_path_contains:
  - .openclaw/workspace/skills/codeguard
  - .openclaw/skills/codeguard
  - .zeptoclaw/skills/codeguard
  - .claude/skills/codeguard
guardrail:
  block_threshold: 4
  alert_threshold: 2
  hilt:
    enabled: true
    min_severity: MEDIUM
  cisco_trust_level: full
  patterns:
    injection:
    - ignore previous
    - ignore all instructions
    - ignore above
    - disregard previous
    - disregard all
    - you are now
    - act as
    - pretend you are
    - bypass
    - jailbreak
    - do anything now
    - dan mode
    secrets:
    - sk-
    - sk-ant-
    - sk-proj-
    - api_key=
    - apikey=
    - '-----begin rsa'
    - '-----begin private'
    - '-----begin openssh'
    - aws_access_key
    - aws_secret_access
    - password=
    - 'token:'
    - 'bearer '
    - ghp_
    - gho_
    - github_pat_
    exfiltration:
    - /etc/passwd
    - /etc/shadow
    - base64 -d
    - base64 --decode
    - exfiltrate
    - send to my server
    - curl http
  severity_mappings:
    injection: HIGH
    secrets: MEDIUM
    exfiltration: HIGH
firewall:
  default_action: deny
  blocked_destinations:
  - 169.254.169.254
  - fd00:ec2::254
  allowed_domains:
  - api.anthropic.com
  - api.github.com
  - github.com
  - objects.githubusercontent.com
  - proxy.golang.org
  - sum.golang.org
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  allowed_ports:
  - 443
  - 80
watch:
  # The autonomous periodic LLM rescan is off (2026-11-17): at 30 min it was the
  # fleet's continuous qwen3.8-27b caller. The rescan now runs once a week at a
  # fixed time via the `homelab-rescan` user timer (hosts/roles/defenseclaw_rescan,
  # runbooks/defenseclaw-rescan.md). New installs are still scanned on install
  # (admission.scan_on_install) and new AI components are still found by
  # ai_discovery (5 min); only the repeated re-scan of existing assets moved to
  # the weekly timer. rescan_interval_min is kept at 7 days as the documented cadence.
  rescan_enabled: false
  rescan_interval_min: 10080
webhooks: []
enforcement:
  max_enforcement_delay_seconds: 2
audit:
  log_all_actions: true
  log_scan_results: true
  retention_days: 90
